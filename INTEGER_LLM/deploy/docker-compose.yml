version: "3.8"

services:
  stage-0:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    command: ["./bin/integer-llm-pipeline", "--stage", "0"]
    volumes:
      - ../theta_v:/app/theta_v:ro
    networks:
      - llm-pipeline

  stage-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    command: ["./bin/integer-llm-pipeline", "--stage", "1"]
    volumes:
      - ../theta_v:/app/theta_v:ro
    networks:
      - llm-pipeline

  stage-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    command: ["./bin/integer-llm-pipeline", "--stage", "2"]
    volumes:
      - ../theta_v:/app/theta_v:ro
    networks:
      - llm-pipeline

  stage-3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    command: ["./bin/integer-llm-pipeline", "--stage", "3"]
    volumes:
      - ../theta_v:/app/theta_v:ro
    networks:
      - llm-pipeline

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    command: ["./bin/integer-llm-runtime", "--api"]
    networks:
      - llm-pipeline

networks:
  llm-pipeline:
    driver: bridge
