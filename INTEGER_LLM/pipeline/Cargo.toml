[package]
name = "integer-llm-pipeline"
version = "0.14.0"
edition = "2021"

[[bin]]
name = "integer-llm-pipeline"
path = "src/main.rs"

[lib]
name = "integer_llm_pipeline"
path = "src/lib.rs"

[features]
default = ["reference"]
reference = ["integer-llm-kernels/reference"]
cpu-simd = ["integer-llm-kernels/cpu-simd"]
cuda = ["integer-llm-kernels/cuda"]
rocm = ["integer-llm-kernels/rocm"]

[dependencies]
integer-llm-kernels = { path = "../kernels" }
integer-llm-runtime = { path = "../runtime" }
crc32fast = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# Testprofil, siehe die ausfuehrliche Begruendung in
# `SHARED_TYPES/myl-types/Cargo.toml`: optimiert, aber `debug-assertions`
# und `overflow-checks` bleiben an. ⚑ `--release` waere die falsche
# Antwort, weil es beide abschaltet.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2
