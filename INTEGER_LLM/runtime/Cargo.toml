[package]
name = "integer-llm-runtime"
version = "0.12.40"
edition = "2021"

[[bin]]
name = "integer-llm-runtime"
path = "src/main.rs"

[lib]
name = "integer_llm_runtime"
path = "src/lib.rs"

[features]
default = ["reference"]
reference = ["integer-llm-kernels/reference"]
cpu-simd = ["integer-llm-kernels/cpu-simd"]
cuda = ["integer-llm-kernels/cuda"]
rocm = ["integer-llm-kernels/rocm"]

[dependencies]
integer-llm-kernels = { path = "../kernels" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokenizers = "0.21"
