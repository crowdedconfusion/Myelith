[package]
name = "integer-llm-kernels"
version = "0.66.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-PolyForm-Shield-1.0.0"
publish = false

[[bin]]
name = "golden_runner"
path = "src/bin/golden_runner.rs"

[features]
default = ["reference"]
reference = []
cpu-simd = []
cuda = []
rocm = []
# Gebuendelte Matrizen auf der GPU von Apple-Silizium. Schliesst
# `cpu-simd` ein, denn alles ausser den Buendeln rechnet weiter die CPU.
# Die Abhaengigkeiten gibt es nur fuer macOS; auf jedem anderen Ziel ist
# das Feature wirkungslos, und `rechenpfad` meldet es nicht.
metal = ["cpu-simd", "dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]

[dependencies]
itertools = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSError", "NSString"] }
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }

[dev-dependencies]

# Testprofil, siehe die ausfuehrliche Begruendung in
# `SHARED_TYPES/myl-types/Cargo.toml`: optimiert, aber `debug-assertions`
# und `overflow-checks` bleiben an. ⚑ `--release` waere die falsche
# Antwort, weil es beide abschaltet.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
# ⚑ **Weniger Debug-Info, keine Pruefung weniger** (2026-08-29). Volle
# Debug-Info kostete gemessen **26 Prozent Rechenzeit je Bau** und
# **40 Prozent Platz** (`myl-node`: 346 auf 256 Sekunden CPU, 2,5 auf
# 1,5 GB). Der Platz zaehlt doppelt, weil der CI-Cache pro Repositorium
# auf 10 GB gedeckelt ist und ein voller Deckel jeden Job kalt bauen
# laesst.
#
# `line-tables-only` behaelt **Datei und Zeile** in jedem Backtrace, und
# das ist, was man liest. Verloren geht nur das Inspizieren von
# Variablen im Debugger; wer das braucht, setzt lokal `debug = true`.
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"

# ⚑ **Nur die beiden rechnenden Kerne, nicht alle Abhaengigkeiten**
# (2026-08-29). `[profile.dev.package."*"]` stand hier einen Tag lang und
# war zu breit: Es uebersetzte auch `tokio`, `libp2p` und `blst`
# optimiert und kostete damit **40 Prozent mehr Rechenzeit je Bau**
# (gemessen an `myl-node`: 481 statt 344 Sekunden CPU). Auf einem
# Zwei-Kern-Runner schlaegt das voll auf die Wanduhr durch.
#
# Langsam waren die Tests aber nur dort, wo **ganzzahlig gerechnet**
# wird, und das sind diese beiden Crates. Sie sind klein; die grossen
# Abhaengigkeiten bauen wieder unoptimiert.
[profile.dev.package.integer-llm-kernels]
opt-level = 2

# ⚑ **Hier steht bewusst NUR der eigene Kern** (2026-09-22). Bis dahin
# stand `[profile.dev.package.integer-llm-runtime]` daneben, und Cargo
# meldete bei jedem Bau dieser Kiste `profile package spec
# integer-llm-runtime in profile dev did not match any packages`: Die
# Abhaengigkeit laeuft von `runtime` auf `kernels` und nicht zurueck,
# also liegt `runtime` hier gar nicht im Baum.
#
# 📌 **Ein Profileintrag greift nur vom Wurzelpaket aus.** Dieselbe Zeile
# steht in `runtime/Cargo.toml`, und dort trifft sie beide Kerne. Wer sie
# hier ergaenzt, weil sie dort richtig ist, ergaenzt eine Zeile ohne
# Wirkung und eine Warnung in jedem Bau.
