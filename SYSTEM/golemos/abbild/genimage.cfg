# Die Platte, die GolemOS am Ende ist.
#
# ⚑ **Vier Partitionen, und jede hat einen Grund:**
#
#   boot      GRUB und der Kern. Muss vfat sein, denn EFI liest nur das.
#   wurzelA   GolemOS
#   wurzelB   dasselbe, noch einmal. ⚑ **Von Anfang an belegt**, nicht
#             erst nach der ersten Aktualisierung: Ein Rückfallweg, den
#             es erst später gibt, fehlt genau beim ersten Mal.
#   daten     Artefakte, Werkzeugkisten, Wissensmappen, Arbeitsordner.
#             ⛔️ **Getrennt, weil sie die Aktualisierung überlebt.**
#             Ein Modell wiegt bis zu 34 GB; es gehört nicht in ein
#             Systemabbild und schon gar nicht zweimal hinein.
#
# ⚠️ **`daten` ist hier klein und wird beim Einrichten gedehnt.** Ein
# Abbild mit fester Datenpartition passte auf genau eine Plattengrösse.

image efi-part.vfat {
	vfat {
		file EFI   { image = "efi-part/EFI" }
		file KERNNAME { image = "KERNNAME" }
	}
	size = 64M
}

image golemos.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 32K
		bootable = true
	}

	# ⚑ **Der Name des Abschnitts IST die Marke.** 📌 Zwei Anlaeufe
	#   gebraucht: `partition-label` kennt genimage 19 nicht, `name`
	#   auch nicht. Der Abschnitt traegt `CFGF_TITLE`, und `image-hd.c`
	#   kopiert seinen Titel in das GPT-Namensfeld. Was GRUB als
	#   `PARTLABEL` sucht, steht also hier in der Ueberschrift.
	#   ⚠️ **Beide Male hat genimage laut abgebrochen**, mit Datei und
	#   Zeile. Buildroot haette dieselbe Lage verschluckt, und der
	#   Fehler waere erst beim Startversuch aufgefallen, ohne Hinweis.
	# ⛔️ **Fund 479: feste Kennungen je Bau.** Die drei `*_UUID` setzt
	#    `nach-dem-abbild.sh` ein, dieselben wie in `grub.cfg`. Siehe dort.
	partition golem-wurzelA {
		partition-type-uuid = L
		partition-uuid = WURZEL_A_UUID
		image = "rootfs.ext2"
	}

	partition golem-wurzelB {
		partition-type-uuid = L
		partition-uuid = WURZEL_B_UUID
		image = "rootfs.ext2"
	}

	# ⛔️ **FAT und nicht ext4, und das ist die wichtigste Entscheidung
	#    dieser Datei.** Ein Nutzer mit frischem Klon soll seine
	#    Gewichte und Einstellungen hier hineinkopieren koennen, **ohne
	#    ein einziges Entwicklerwerkzeug**. ext4 kann macOS nicht
	#    beschreiben und Windows auch nicht; FAT kann jedes System.
	#
	#    ⚠️ **Der Preis ist ein fehlendes Journal**, und der gehoert
	#    genannt: Bei der Wurzel habe ich ext4 genau deswegen gewaehlt.
	#    Hier wiegt „jeder Rechner kann daraufschreiben" schwerer, und
	#    der Grossteil sind Gewichte, die nur gelesen werden. Gemildert
	#    durch `mount -o flush`: Geschriebenes geht sofort auf den
	#    Datentraeger statt im Zwischenspeicher zu warten.
	#
	#    ⚑ **Gemessen, dass es passt:** Die groesste Einzeldatei in
	#    Artefakten und Gewichten ist 1,84 GB, die FAT32-Grenze liegt
	#    bei 4 GB.
	#
	#    ⚠️ **32 MB sind Absicht und ein Platzhalter.** Der erste Start
	#    dehnt die Partition auf den ganzen Datentraeger und formatiert
	#    sie; siehe `overlay/etc/init.d/S05daten`.
	# ⛔️ **Fund 476: Der Typ entscheidet, ob ein fremdes System
	#    ueberhaupt nachsieht.** Hier stand der Linux-Typ, und damit
	#    meldete macOS auf einer fertig formatierten FAT32-Partition
	#    „kein Dateisystem"; Windows vergibt solchen Partitionen keinen
	#    Laufwerksbuchstaben. Alles oben Gesagte ueber „jeder Rechner kann
	#    daraufschreiben" galt also nie. Mit „Microsoft Basic Data" haengt
	#    macOS `GOLEM-DATEN` sofort ein (gemessen am 2026-09-25). Linux
	#    schaut auf das Dateisystem, nicht auf den Typ.
	partition golem-daten {
		partition-type-uuid = ebd0a0a2-b9e5-4433-87c0-68b6b72699c7
		partition-uuid = DATEN_UUID
		size = 32M
	}
}
