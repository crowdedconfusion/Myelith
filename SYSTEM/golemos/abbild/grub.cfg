# ⚑ **Zwei Einträge, und der zweite ist keine Zugabe.**
#
# GolemOS hält zwei Wurzelpartitionen. Eine Aktualisierung schreibt das
# neue Abbild auf die **inaktive** und schaltet um; geht dabei etwas
# schief, wählt der Mensch hier die alte. ⛔️ **Eine unterbrochene
# Aktualisierung kann das System damit nicht zerlegen**, und das kann
# kein Paketverwalter zusagen.
#
# ⛔️ **Fund 479: PARTUUID und nicht `PARTLABEL`.** Hier stand die Marke,
# mit der Begründung, eine Kennung müsse nach jedem Bau nachgetragen
# werden. Dann kam die Installation, und seither tragen Stick und Platte
# dieselben Marken. Gemessen am 2026-09-25: Vom Stick gestartet, die
# installierte Platte zuerst gefunden, nahm der Kern **Wurzel und Daten
# von der Platte**, und der Assistent hielt die Platte für die
# Startplatte und bot den Stick als Ziel an.
#
# ⚑ **Nachgetragen wird jetzt maschinell:** `nach-dem-abbild.sh` würfelt
# je Bau drei Kennungen aus und setzt sie hier und in `genimage.cfg`
# ein (`WURZEL_A_UUID`, `WURZEL_B_UUID`, `DATEN_UUID`). Die
# Installation vergibt der Platte neue und schreibt sie hier um.
# ⚠️ Zwei Sticks aus **demselben** Bau in einer Maschine tragen dieselben
# Kennungen; zwei Bauten nie.

set default="0"
set timeout="5"

# ⛔️ **Ohne `console=` redet der Kern in den leeren Raum.**
#
# 📌 Gemessen am 2026-09-24: GRUB erschien, das Menue lief ab, „Booting
# `GolemOS (A)'" stand da, und dann kam nichts mehr. Der Kern war
# gestartet und schrieb auf `tty1`, also auf einen Bildschirm, den eine
# Maschine ohne Grafik nicht hat. ⚠️ **Das sah aus wie ein Absturz und
# war keiner.**
#
# ⚑ **Linux schreibt auf ALLE genannten Konsolen und macht die LETZTE zu
# `/dev/console`**, also zu der, auf der die Anmeldung erscheint. Daraus
# folgt die Aufteilung:
#
#   A und B          `tty1` zuletzt: Wer einen Bildschirm hat, bekommt
#                    dort die Anmeldung, und die serielle Schnittstelle
#                    zeigt trotzdem jede Startmeldung.
#   Selbstprobe      `SERIELL` zuletzt: Eine Diagnose liest man ueber die
#                    serielle Schnittstelle, oft ohne Bildschirm.

# ⛔️ **Fund 477: `SERIELL` ist ein Platzhalter**, eingesetzt von
#    `nach-dem-abbild.sh`: `ttyS0` auf x86_64, `ttyAMA0` auf aarch64.
#    Hier stand fest `ttyS0`, und auf ARM gibt es das nicht. Nach dem
#    Start von Platte kam dort ab `init` nichts mehr auf der seriellen
#    Leitung an, keine Meldung und keine Anmeldung (gemessen am
#    2026-09-25 unter QEMU mit UEFI).
menuentry "GolemOS (A)" {
  linux /KERNNAME root=PARTUUID=WURZEL_A_UUID rootwait console=SERIELL,115200 console=tty1 golemos.daten=PARTUUID=DATEN_UUID
}

menuentry "GolemOS (B)" {
  linux /KERNNAME root=PARTUUID=WURZEL_B_UUID rootwait console=SERIELL,115200 console=tty1 golemos.daten=PARTUUID=DATEN_UUID
}

# ⚑ **Die Selbstprobe als eigener Eintrag.** Sie druckt, was da ist, und
# schaltet ab. Wer ein Geraet in der Hand hat und wissen will, ob es
# heil ist, waehlt hier statt eine Konsole zu suchen; und ein
# automatischer Startversuch kann sie ohne Tastatur anwaehlen.
menuentry "GolemOS Selbstprobe" {
  linux /KERNNAME root=PARTUUID=WURZEL_A_UUID rootwait golemos.probe console=tty1 console=SERIELL,115200 golemos.daten=PARTUUID=DATEN_UUID
}
