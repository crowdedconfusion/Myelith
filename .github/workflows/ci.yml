name: CI

# ── Wann die Pruefung laeuft ──────────────────────────────────────────
#
# `paths-ignore` schaltet den ganzen Ablauf nur ab, wenn ein Commit
# ausschliesslich sichere Doku beruehrt. ⛔️ Nicht `**.md`: Proben lesen
# `NOTICES.md`, das CLIENT-README, Skills und die READMEs der
# Werkzeugkisten; ein Commit, der nur `NOTICES.md` berichtigte, startete
# sonst keinen Lauf (2026-10-17). Wer hier ein Muster ergaenzt, prueft vorher,
# ob eine Probe die Dateien liest.
#
# Nicht feiner je Job: An `myl-types` haengen acht Kisten, an `kernels` vier;
# ein Filter je Job spraeche kaum an und waere eine zweite Wahrheit ueber den
# Abhaengigkeitsgraphen.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README.en.md'
      - 'README/Glossar.md'
      - 'README/Glossary.en.md'
      - 'README/Whitepaper/**.md'
      - 'README/Grafiken/**'
      - 'LICENSE.md'
  # Woechentlich: Schwachstellen, die neu bekannt werden, und die langsamen
  # Simulationen, die an einem Python-Wechsel brechen statt an einem Commit.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README.en.md'
      - 'README/Glossar.md'
      - 'README/Glossary.en.md'
      - 'README/Whitepaper/**.md'
      - 'README/Grafiken/**'
      - 'LICENSE.md'

# ⚑ Nur lesend. Ohne diese Zeile gilt, was in den Einstellungen des
# Repositoriums steht, und das kann Schreibrecht sein. Kein Job hier
# schreibt etwas zurueck.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  # Warnungen sind Fehler (Fund A1: eine unbeachtete Warnung liess einen
  # kaputten Testbau nach main).
  RUSTFLAGS: "-D warnings"
  # ⚑ **Ein Bauordner je Job, absolut** (2026-10-22). Hier stand `target`,
  #   und Cargo loest einen relativen Pfad gegen das Verzeichnis jeder Kiste
  #   auf: Jede Kiste baute libp2p, blst und tokio von vorn, der Job der
  #   Protokollkisten lief 47 Minuten. Absolut teilen sich die Kisten eines
  #   Jobs die uebersetzten Abhaengigkeiten, wie lokal unter SYSTEM/full-build.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # Klein genug fuer den Zwischenspeicher (GitHub deckelt ihn bei 10 GB je
  # Repositorium, und ein uebervoller wirft die aeltesten Eintraege, worauf
  # jeder Job kalt baut; so geschehen am 2026-08-29). Die Debug-Informationen
  # sind der groesste Teil eines Bauordners und werden in der CI nicht
  # gelesen. `debug-assertions` und `overflow-checks` bleiben an: Sie stehen
  # im Testprofil jeder Kiste, und genau sie finden Ueberlaeufe.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # ── Vorpruefung: alles, was nichts uebersetzt ──────────────────────
  #
  # In Sekunden fertig, und was hier faellt, soll nicht erst nach zwanzig
  # Minuten Bau auffallen.
  vorpruefung:
    name: Vorpruefung (Kisten, Fassung, Sperrdateien, Audits, Ethik)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Jede Kiste in genau einer Gruppe, jede auf der Fassung der
      # Werkzeugkette (Fund 65, Fund 511: Kisten ohne Testschritt).
      - name: Jede Kiste in einer Gruppe, jede auf einer Fassung
        run: .github/ci/kisten.sh wache

      # ⚑ Wer eine Version in `Cargo.toml` erhoeht, laesst cargo dabei nicht
      #   laufen, und nur cargo schreibt die Sperrdatei; `--locked` faellt dann
      #   erst nach Minuten Bau, in einem fremden Job (2026-09-08, 2026-09-09).
      - name: Jede Sperrdatei traegt die Version ihrer Kisten
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          wurzel = pathlib.Path(".")
          def ohne_bau(p): return not any(t in ("target", "full-build", "crates-lager") for t in p.parts)

          def eigene(text):
              a = re.search(r"(?ms)^\[package\]\n(.*?)(?=^\[|\Z)", text)
              if not a: return None
              n = re.search(r'(?m)^\s*name\s*=\s*"([^"]+)"', a.group(1))
              v = re.search(r'(?m)^\s*version\s*=\s*"([^"]+)"', a.group(1))
              return (n.group(1), v.group(1)) if n and v else None

          kisten = {}
          for k in sorted(filter(ohne_bau, wurzel.rglob("Cargo.toml"))):
              e = eigene(k.read_text(encoding="utf-8"))
              if e: kisten.setdefault(e[0], (e[1], k))

          schief, gezaehlt = [], 0
          for lock in sorted(filter(ohne_bau, wurzel.rglob("Cargo.lock"))):
              gezaehlt += 1
              for m in re.finditer(
                  r'(?ms)^\[\[package\]\]\nname = "([^"]+)"\nversion = "([^"]+)"',
                  lock.read_text(encoding="utf-8")):
                  name, hat = m.group(1), m.group(2)
                  if name in kisten and kisten[name][0] != hat:
                      schief.append(f"  {name}: {kisten[name][1]} sagt {kisten[name][0]}, {lock} sagt {hat}")

          if schief:
              print("Sperrdateien und Kistenversionen laufen auseinander:")
              print("\n".join(sorted(set(schief))))
              print("Abhilfe: in der betroffenen Kiste einmal `cargo metadata` laufen lassen.")
              sys.exit(1)
          print(f"{gezaehlt} Sperrdateien geprueft, jede traegt die Version ihrer Kisten.")
          PY

      # Gleitkomma im Rechenpfad, Skalen, theta_v gegen die Vektoren (Fund
      # 358), das Testprofil (wer die CI mit `--release` beschleunigt,
      # schaltet die Ueberlaufpruefung ab) und die Streitlast-Tabelle.
      - name: Audit der Zahlensemantik
        working-directory: INTEGER_LLM
        run: |
          python3 tests/audit/test_no_float.py
          python3 tests/audit/test_scales.py
          python3 tests/regression/test_theta_v_changes.py
          python3 tests/audit/test_profile.py
          python3 tests/audit/test_streitlast.py

      # 📌 Hier liefen bis zum 2026-10-22 auch `test_division.py` und
      #   `test_overflow.py`. Beide rufen `cargo test` und uebersetzten die
      #   Kerne damit ein zweites Mal, in einem Job ohne Werkzeugkette; sie
      #   laufen in der Gruppe `rechnen`, wo die Kerne ohnehin gebaut sind.
      - name: Einheitentests ohne Fremdbibliotheken
        working-directory: INTEGER_LLM
        run: |
          python3 tests/test_calibration.py
          python3 tests/test_fixed_point.py
          python3 tests/test_kernels.py
          python3 tests/test_luts.py
          python3 tests/test_rmsnorm.py
          python3 tests/test_rope.py
          python3 tests/test_rope_nachziehen.py

      # Lizenzen der Netzmodelle, Modellkarte, Ausschlusskatalog und der
      # Aufnahmeantrag in beiden Richtungen: Der vollstaendige kommt durch,
      # die leere Vorlage faellt durch.
      - name: "COMPLIANCE/ethics: Lizenz, Modellkarte, Ausschlusskatalog, Aufnahmeantrag"
        run: |
          set -e
          python3 COMPLIANCE/ethics/werkzeuge/lizenzprobe.py
          python3 COMPLIANCE/ethics/werkzeuge/modellkarte.py --pruefe
          python3 COMPLIANCE/ethics/werkzeuge/ausschlussprobe.py
          python3 COMPLIANCE/ethics/werkzeuge/pruefe_antrag.py \
            COMPLIANCE/ethics/vorlagen/korpus-aufnahmeantrag-beispiel.json
          echo "ok: der vollstaendige Beispielantrag kommt durch"
          python3 COMPLIANCE/ethics/werkzeuge/pruefe_antrag.py \
            COMPLIANCE/ethics/vorlagen/korpus-aufnahmeantrag.json && {
              echo "FEHLER: die leere Vorlage darf nicht als vollstaendig gelten"
              exit 1
            } || echo "ok: die leere Vorlage faellt durch, wie sie soll"

      # Die Regeln der Sicherheitskopie an einem kleinen Baum: Auswahl,
      # Verknuepfungen, fehlende Artefakte, tar und zip mit Pruefsummen.
      - name: "Sicherheitskopie: Selbsttest der Regeln"
        run: python3 SYSTEM/install/sicherung.py --selbsttest

  # ── Die Kisten unter Linux, in vier Gruppen ─────────────────────────
  #
  # Clippy und Proben je Kiste, offline aus dem Vorrat; welche Kiste in
  # welcher Gruppe steht und was je Kiste laeuft, sagt `.github/ci/kisten.sh`.
  # ⚑ Vier Gruppen statt eines Jobs von 47 Minuten, und jede mit eigenem
  #   Zwischenspeicher. Am 2026-08-29 war eine Teilung schon einmal
  #   zurueckgenommen worden, weil die Speicher einander verdraengten; damals
  #   baute jede Kiste in einen eigenen Ordner und mit Debug-Informationen.
  #   Ob es diesmal traegt, zeigt die Groesse der Eintraege nach den ersten
  #   Laeufen.
  kisten:
    name: Kisten ${{ matrix.gruppe }} (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        gruppe: [rechnen, protokoll, knoten, klient]
    # In der CI liegt kein Modell. Die Erlaubnis, Proben mit Gewichten zu
    # ueberspringen, steht deshalb fuer den ganzen Job; ohne sie schlaegt
    # ein fehlendes Modell fehl, statt still abzuspringen (Fund 113).
    env:
      MYL_OHNE_ARTEFAKTE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/einrichten
        with:
          cache: kisten-${{ matrix.gruppe }}
          oberflaeche: ${{ matrix.gruppe == 'klient' }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.gruppe == 'rechnen'
        with:
          python-version: "3.12"

      - name: Clippy und Proben
        run: .github/ci/kisten.sh pruefen ${{ matrix.gruppe }}

      # Divisionssemantik und Ueberlauf rufen `cargo test` der Kerne; hier
      # sind sie warm. Dazu der Bitgleichheits-Anker: ohne Artefakte die
      # sechs Operationsvektoren gegen die Referenz.
      - name: Audit der Kerne und Konformitaet der Operationen
        if: matrix.gruppe == 'rechnen'
        run: |
          (cd INTEGER_LLM && python3 tests/audit/test_division.py && python3 tests/audit/test_overflow.py)
          (cd INTEGER_LLM/conformance && ./run.sh reference)

      - name: Konformitaetswert (Linux, x86_64)
        if: matrix.gruppe == 'knoten'
        run: .github/ci/kisten.sh konformitaet "x86_64/Linux"

  # ── Das Netz unter Laufzeit und Verlust (2026-10-22) ────────────────
  #
  # Jeder Knoten ein eigener Prozess in einem eigenen Netz-Namensraum, 50 bis
  # 200 ms je Richtung und 1 bis 5 % Verlust mit `tc netem`, dazu Trennung,
  # Absturz, ein Neuling und ein Einstieg nur ueber mDNS. Der Lauf im selben
  # Prozess zeigte keinen der drei Fehler, die dieser am ersten Tag fand:
  # verworfene Bloecke, die zu frueh kamen; einen Testverkehr, der den
  # Zustand nie bewegte; die Rueckschleife eines anderen im Adressbuch.
  netzbedingungen:
    name: Netz unter Laufzeit und Verlust (tc netem)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/einrichten
        with:
          cache: netz

      - name: myl-node bauen
        working-directory: NODE/myl-node
        run: cargo build --release --locked --offline

      # Der Kern des Laeufers bringt `sch_netem` nicht immer geladen mit.
      - name: Kernelmodul sch_netem
        run: |
          sudo modprobe sch_netem || {
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }

      - name: Netzlauf mit getrennten Prozessen
        run: |
          sudo -E env "PATH=$PATH" python3 TESTCLIENT/netzbedingungen/netzlauf_prozesse.py \
            --programm "$CARGO_TARGET_DIR/release/myl-node" --protokolle "$RUNNER_TEMP/netzlauf"

      - name: Protokolle sichern
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netzlauf-protokolle
          path: ${{ runner.temp }}/netzlauf
          if-no-files-found: ignore

  # ── Windows und macOS ──────────────────────────────────────────────
  #
  # Nur, was sich zwischen den Systemen unterscheiden kann: das Rechnen auf
  # einer zweiten Architektur (macOS ist ARM64, Linux und Windows sind
  # x86_64), Pfade und Prozesse (Windows), das Fenster. Ein Job je System und
  # Gruppe statt bisher fuenf unter Windows und vier unter macOS, die
  # dieselben Abhaengigkeiten je einzeln uebersetzten. Unter macOS nur die
  # Kerne, denn dort laeuft die Entwicklung, und jede Minute zaehlt zehnfach.
  plattform:
    name: ${{ matrix.gruppe }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, gruppe: plattform-kerne }
          - { os: windows-latest, gruppe: plattform-klient }
          - { os: macos-latest, gruppe: plattform-kerne }
    env:
      MYL_OHNE_ARTEFAKTE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/einrichten
        with:
          cache: ${{ matrix.gruppe }}

      # ⚑ Die Shell kommt unter Windows von Git for Windows, wie bei einem
      #   Nutzer; ohne sie melden `run_command` und die Manifeste, dass sie
      #   fehlt (Fund 558).
      - name: Clippy und Proben
        shell: bash
        run: .github/ci/kisten.sh pruefen ${{ matrix.gruppe }}

      # Nur uebersetzen und Clippy, nicht rechnen: Der Metal-Weg braucht eine
      # GPU mit Metal 4, die ein gehosteter Laeufer nicht sicher hat.
      - name: Clippy der Kerne mit Metal (macOS)
        if: runner.os == 'macOS'
        working-directory: INTEGER_LLM/kernels
        run: cargo clippy --locked --offline --all-targets --features metal -- -D warnings

      # ⚑ Die Kernthese auf einer zweiten Architektur und einem zweiten
      #   System: derselbe Wert wie unter Linux.
      - name: Konformitaetswert
        if: matrix.gruppe == 'plattform-kerne'
        shell: bash
        run: .github/ci/kisten.sh konformitaet "${{ runner.arch }}/${{ runner.os }}"

      # Der Bitgleichheits-Anker auf ARM64: dieselben sechs Vektoren wie
      # unter Linux, gegen die Referenz. Der Vergleich ist der Zweck.
      - name: Konformitaet der Operationen (macOS, ARM64)
        if: runner.os == 'macOS'
        working-directory: INTEGER_LLM/conformance
        run: ./run.sh reference

      # Dass `myl` startet und einen unbekannten Befehl als Fehler meldet.
      # ⚑ `--profile test` nutzt, was die Proben schon uebersetzt haben; ein
      #   blosses `cargo run` baute alles ein drittes Mal, im Entwicklungsprofil.
      - name: Startprobe des Klienten
        if: matrix.gruppe == 'plattform-kerne'
        shell: bash
        working-directory: CLIENT/myl-client
        run: |
          cargo run --locked --offline --quiet --profile test -- --hilfe > /dev/null
          if cargo run --locked --offline --quiet --profile test -- kein-solcher-befehl > /dev/null 2>&1; then
            echo "FEHLER: myl meldet einen unbekannten Befehl nicht."
            exit 1
          fi
          echo "Start belegt fuer ${{ runner.os }}"

      # Der Testclient laeuft bei Dritten, und Windows ist das System, das
      # hier niemand von Hand prueft: ohne Terminal keine Steuersequenzen und
      # kein Warten auf eine Taste; die Befehle ohne Modell ausgefuehrt, nicht
      # nur uebersetzt; und der Vergleich muss ein leeres Verzeichnis
      # ablehnen (Fund 35). `artefakte` fehlt mit Absicht: Ohne Artefakte
      # meldet er zu Recht Rueckgabe 1.
      # 📌 Unter bash mit `set -e`: PowerShell bricht nach einem gescheiterten
      #   Programmaufruf nicht ab, und mehrere Aufrufe in einem Schritt
      #   verdeckten so jeden Fehler ausser dem letzten.
      - name: Testclient ohne Terminal und ohne Modell (Windows)
        if: runner.os == 'Windows' && matrix.gruppe == 'plattform-kerne'
        shell: bash
        working-directory: TESTCLIENT/myl-testclient
        run: |
          set -euo pipefail
          lauf() { cargo run --locked --offline --quiet --profile test -- "$@"; }
          lauf --quiet --name ci stack
          lauf --help > /dev/null
          lauf --quiet plan --plan-id ci --out ci.plan
          mkdir -p ci-logs
          lauf modellstaende --logs ci-logs
          if lauf vergleich --logs ci-logs; then
            echo "FEHLER: vergleich hat ein leeres Verzeichnis als Nachweis durchgehen lassen"
            exit 1
          fi
          echo "Testclient belegt auf Windows: ohne Terminal, ohne Modell, leerer Vergleich abgelehnt"

  # ── Kalter Klon ohne Netz, auf allen drei Systemen ──────────────────
  #
  # ⛔️ Baut ein frischer Klon alles, was ausgeliefert wird, aus dem Vorrat,
  # im Freigabeprofil? Ohne Zwischenspeicher, denn kalt ist der Zweck. Die
  # Liste kommt aus den Manifesten (`ausliefern` unter
  # `[package.metadata.myelith]`), wie in den Einrichtungsskripten.
  kalter-klon:
    name: Kalter Klon ohne Netz (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/einrichten
        with:
          oberflaeche: "true"

      - name: Jede ausgelieferte Kiste, offline
        shell: bash
        run: |
          gefunden=0
          for kiste in $(grep -rl '^ausliefern = ' --include=Cargo.toml . | grep -v -e '/target/' -e 'SYSTEM/' | sort); do
            gefunden=$((gefunden + 1))
            echo "── $(dirname "$kiste")"
            cargo build --release --locked --offline --manifest-path "$kiste"
          done
          if [ "$gefunden" -eq 0 ]; then
            echo "FEHLER: keine einzige Kiste zum Ausliefern gefunden, also nichts geprueft"
            exit 1
          fi
          echo "$gefunden Kiste(n) aus dem Vorrat gebaut, ohne Netz"

      - name: Startprobe
        shell: bash
        run: |
          "$CARGO_TARGET_DIR/release/myl" --hilfe > /dev/null
          echo "myl startet auf ${{ matrix.os }}"

  # ── Abhaengigkeiten: Schwachstellen, Lizenzen, Herkunft ─────────────
  #
  # Bei jedem Push und im woechentlichen Zeitplan, und der zweite ist der
  # eigentliche Zweck: Eine Schwachstelle wird nicht bekannt, wenn jemand
  # committet. Bis zu sieben Tage Verzug, wenn niemand committet; das ist die
  # Zusage. Die Begruendung je Regel steht in `deny.toml`.
  abhaengigkeiten:
    name: Abhaengigkeitspruefung (cargo-deny, NOTICES)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/einrichten
        with:
          vorrat: "false"

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny

      - name: Jede Kiste gegen deny.toml
        run: |
          set -euo pipefail
          gefunden=0
          fehler=0
          for manifest in */*/Cargo.toml SYSTEM/*/*/Cargo.toml; do
            gefunden=$((gefunden + 1))
            echo "── deny: $(dirname "$manifest")"
            cargo deny --manifest-path "$manifest" --config deny.toml check || fehler=$((fehler + 1))
          done
          [ "$gefunden" -gt 0 ] || { echo "FEHLER: keine Kiste gefunden"; exit 1; }
          echo "$gefunden Kiste(n) geprueft, $fehler mit Fehlschlag"
          [ "$fehler" -eq 0 ]

      # Die Lizenzliste ist erzeugt; wer eine Abhaengigkeit anhebt und sie
      # nicht neu schreibt, faellt hier auf (Fund 557).
      - name: "COMPLIANCE: NOTICES entspricht den Quellen"
        run: python3 COMPLIANCE/werkzeuge/notices.py --pruefe

  # ── Fuzzing der Drahtformate, nur im Zeitplan und von Hand ──────────
  #
  # Geprueft wird Kanonizitaet: Liest sich eine Bytefolge vollstaendig als
  # Typ, muss sie sich genau so wieder schreiben lassen. Nightly nur hier,
  # weil libfuzzer Sanitizer braucht; die Fuzz-Kisten liegen eine Ebene
  # tiefer (`*/*/fuzz`), damit keine andere Schleife sie einsammelt. Der
  # eingecheckte Korpus laeuft als gewoehnliche Probe bei jedem Push.
  fuzzing:
    name: Fuzzing der Drahtformate (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz

      - name: Jedes Ziel jedes Fuzz-Crates
        run: |
          set -euo pipefail
          crates=0
          ziele=0
          for manifest in */*/fuzz/Cargo.toml; do
            crate=$(dirname "$(dirname "$manifest")")
            crates=$((crates + 1))
            echo "══ $crate"
            for ziel in $(cd "$crate" && cargo +nightly fuzz list); do
              ziele=$((ziele + 1))
              echo "── fuzz: $crate/$ziel"
              (cd "$crate" && cargo +nightly fuzz run "$ziel" -- -max_total_time=30 -print_final_stats=1)
            done
          done
          [ "$ziele" -gt 0 ] || { echo "FEHLER: kein Fuzz-Ziel gefunden"; exit 1; }
          echo "$ziele Ziel(e) in $crates Crate(s) gefuzzt"

      - name: Reproduzierer sichern
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-reproduzierer
          path: '*/*/fuzz/artifacts/**'
          if-no-files-found: ignore

  # ── Kalibrierung mit torch: eigener Job ────────────────────────────
  #
  # Quantisierer, Statistik-Sammler, GPTQ, Exportweg und Gammaentzerrung,
  # also der Weg, auf dem aus Gleitkomma-Gewichten ein konsensrelevantes
  # Artefakt wird. Eigener Job, weil torch ein bis zwei Minuten kostet; nur
  # die CPU-Fassung, ohne Modellgewichte.
  kalibrierung-python:
    name: Kalibrierung, Python-Einheitentests (torch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: torch (nur CPU) und numpy
        run: |
          python3 -m pip install --upgrade pip
          # Die Fassungen aus der festen Liste, damit die CI prueft, was lokal
          # rechnet, und nicht, was am Tag des Laufs oben liegt.
          fest=INTEGER_LLM/calibrate/requirements-fest.txt
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==$(sed -n 's/^torch==//p' "$fest")"
          python3 -m pip install "numpy==$(sed -n 's/^numpy==//p' "$fest")"

      - name: Einheitentests des Kalibrierungswegs
        working-directory: INTEGER_LLM
        run: |
          python3 tests/test_activation_stats.py
          python3 tests/test_gptq.py
          python3 tests/test_export_workflow.py
          python3 tests/test_moe_entschmelzen.py
          python3 tests/test_gammaentzerrung.py

  # ── Whitepaper-Simulationen (Anhang B.9) ───────────────────────────
  #
  # Laeuft eines der Programme nicht mehr, zitiert das Papier etwas, das es
  # nicht gibt. Die zwei langsamen (56 s und 28 s) laufen nur, wenn sie sich
  # geaendert haben, und woechentlich; ihre Stichprobenzahlen sind die, mit
  # denen die Zahlen des Anhangs entstanden, und werden nicht gesenkt.
  simulationen:
    name: Whitepaper-Simulationen (Anhang B.9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Geaenderte Simulationen ermitteln
        id: diff
        env:
          VORHER: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "langsame=ja" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$VORHER" HEAD 2>/dev/null \
               | grep -q 'README/Whitepaper/simulations/'; then
            echo "langsame=ja" >> "$GITHUB_OUTPUT"
          else
            echo "langsame=nein" >> "$GITHUB_OUTPUT"
          fi

      - name: Alle Simulationen ausfuehren
        working-directory: README/Whitepaper/simulations
        env:
          LANGSAME: ${{ steps.diff.outputs.langsame }}
        run: |
          set -e
          LANGSAM="topk_stability_sim.py robustness_sim.py"
          for f in *.py; do
            case " ${LANGSAM} " in
              *" ${f} "*)
                if [ "${LANGSAME}" != "ja" ]; then
                  echo "  UEBERSPRUNGEN (langsam, unveraendert): ${f}"
                  continue
                fi
                ;;
            esac
            python3 "$f" >/dev/null
            echo "  OK: ${f}"
          done
