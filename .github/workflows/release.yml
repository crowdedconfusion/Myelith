# Gebaute Binaries je Plattform, damit Mitmachen kein Rust braucht.
#
# # ⚑ Warum es das gibt
#
# Heute klont ein Teilnehmer das Repositorium und übersetzt selbst; der
# Starter bietet an, Rust zu installieren, wenn es fehlt. Das ist eine
# Hürde vor genau dem Test, der ohne Hürde stattfinden soll: Rechnen
# zwei fremde Maschinen dasselbe?
#
# # ⚑ Was diesen Job von einem gewöhnlichen Release-Job unterscheidet
#
# **Jedes Binary belegt vor der Veröffentlichung, dass es richtig
# rechnet.** Der Konformitätslauf läuft mit dem **gebauten Binary** auf
# dem Runner, der es gebaut hat, und sein Gesamtwert muss der bekannte
# sein. Ein Binary, das anders rechnet, ist kein langsames, sondern ein
# schädliches: Es liefert Segmente, die von den redundanten abweichen.
#
# Gemessen am 2026-08-29, und deshalb steht die Prüfung hier: Ein auf
# aarch64/macOS quergebautes x86_64-Binary lieferte denselben Wert wie
# das native. Zwei Architekturen, ein Wert.
#
# # Was dieser Job NICHT leistet
#
# - **Keine musl-Ziele.** Die Linux-Binaries binden gegen die glibc des
#   Runners; auf einer älteren Verteilung starten sie nicht. Wer das
#   braucht, baut selbst oder wir nehmen musl auf, sobald jemand es
#   meldet. Eine Zusage, die niemand geprüft hat, wäre schlimmer als die
#   fehlende.
# - **Kein Modell.** Die Artefakte sind mehrere Gigabyte groß und
#   entstehen aus einem Kalibrierungslauf; sie gehören nicht in ein
#   Release.
# - **Keine Signatur der Binaries.** Es gibt Prüfsummen, und die sagen
#   nur, dass die Datei unverändert ankam, nicht von wem sie stammt.
#   macOS-Gatekeeper und Windows-SmartScreen werden das Ergebnis
#   entsprechend anmeckern.
# - **Keine Oberfläche.** `myl-oberflaeche` ist hier nicht dabei. Sie
#   braucht je Plattform ein eigenes Bündel (`.app`/`.dmg`, `.msi`,
#   AppImage) und auf Linux die WebKit-Pakete des Runners; das ist ein
#   eigener Job und keine sechste Zeile in diesem hier. Wer sie will,
#   baut sie mit `werkzeuge/freigabe.sh` für die eigene Maschine.
# - **Nicht reproduzierbar.** Zwei Läufe geben verschiedene Summen. Die
#   Summen belegen, dass eine heruntergeladene Datei die ist, die
#   gebaut wurde, nicht, dass jemand anders denselben Bau nachvollziehen
#   kann.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # ⚑ Die `.cargo/config.toml` des Repositoriums legt `target-shared`
  # als Ausgabeverzeichnis fest, damit die 18 eigenständigen Crates ihre
  # gemeinsamen Abhängigkeiten nicht 18-mal übersetzen. Hier wird der
  # Pfad ausdrücklich gesetzt, weil die Schritte unten ihn benennen und
  # eine stille Änderung an der Konfiguration sie sonst ins Leere
  # zeigen ließe.
  CARGO_TARGET_DIR: target

jobs:
  bauen:
    name: ${{ matrix.ziel }}
    runs-on: ${{ matrix.os }}
    strategy:
      # ⚑ Ein fehlendes Runner-Label darf nicht die übrigen Ziele
      # mitreißen. Es fällt dann sichtbar aus, statt das ganze Release
      # zu verhindern.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ziel: x86_64-unknown-linux-gnu
            eigen: true
          - os: ubuntu-24.04-arm
            ziel: aarch64-unknown-linux-gnu
            eigen: true
          - os: windows-latest
            ziel: x86_64-pc-windows-msvc
            eigen: true
            endung: .exe
          - os: macos-latest
            ziel: aarch64-apple-darwin
            eigen: true
          # ⚑ `eigen: false`: Der macOS-Runner ist arm64 und führt ein
          # x86_64-Binary ohne Rosetta nicht aus. Dieses eine Ziel kann
          # sich deshalb nicht selbst prüfen, und das steht hier, statt
          # dass der Schritt still übersprungen aussieht wie ein
          # bestandener.
          - os: macos-latest
            ziel: x86_64-apple-darwin
            eigen: false
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.ziel }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.ziel }}

      - name: Testclient bauen
        shell: bash
        working-directory: TESTCLIENT/myl-testclient
        run: cargo build --release --locked --target ${{ matrix.ziel }}

      - name: Knoten bauen
        shell: bash
        working-directory: NODE/myl-node
        run: cargo build --release --locked --target ${{ matrix.ziel }}

      # ⚑ Der Client kam am 2026-09-08 dazu. Bis dahin lieferte dieser
      # Job Knoten und Testclient, also die beiden Programme fuer
      # Teilnehmer, und nicht das Programm, mit dem ein Mensch das Netz
      # ueberhaupt benutzt.
      - name: Client bauen
        shell: bash
        working-directory: CLIENT/myl-client
        run: cargo build --release --locked --target ${{ matrix.ziel }}

      # ⚑ Der Kern dieses Workflows. Nicht der Bau belegt etwas, sondern
      # dieser Lauf: Das **gebaute** Binary rechnet die sechs
      # Operations-Vektoren, und der Gesamtwert muss der bekannte sein.
      # Er braucht kein Modell.
      - name: Konformitaet des gebauten Binaries
        if: matrix.eigen
        shell: bash
        run: |
          set -e
          BIN="TESTCLIENT/myl-testclient/target/${{ matrix.ziel }}/release/myl-test${{ matrix.endung }}"
          mkdir -p release-konf
          "$BIN" --name release --logs release-konf konformitaet
          # ⛑ **Hier stand nur `894d…`, und das ist der Abdruck von
          # `konformitaet_op`, also nur der sechs Operations-Vektoren.**
          # Der Lauf prueft siebzehn. Ein Binary mit einem abweichenden
          # Trainings- oder MoE-Kern waere veroeffentlicht worden, und
          # genau dessen Bitgleichheit ist die Zusage, die dieses
          # Release gibt.
          for paar in "894d8357ae92b5c1:konformitaet_op (6 Vektoren)" \
                      "6da384ba301b9454:konformitaet gesamt (17 Vektoren)"; do
            abdruck="${paar%%:*}"; was="${paar#*:}"
            if ! grep -q "$abdruck" release-konf/*.jsonl; then
              echo "FEHLER: dieses Binary rechnet anders als das Netz."
              echo "$was weicht ab, erwartet $abdruck. Gefunden:"
              grep -o '"name":"[^"]*","digest":"[^"]*"' release-konf/*.jsonl || cat release-konf/*.jsonl
              exit 1
            fi
          done
          echo "Konformitaet belegt fuer ${{ matrix.ziel }}: 17 Vektoren"

      # ⚑ **Warum der Client keinen eigenen Konformitaetslauf bekommt.**
      # Er koennte einen haben, und er waere eine Doppelung: `myl` und
      # `myl-test` binden dieselben Kerne, gebaut aus derselben Quelle,
      # mit derselben Toolchain, auf demselben Runner. Ganzzahlarithmetik
      # ist exakt; Inlining und LTO koennen ein Ergebnis nicht
      # verschieben, wie es bei Gleitkomma der Fall waere. Der Lauf oben
      # belegt die Kerne dieses Runners, und `myl` traegt dieselben.
      #
      # Was er **nicht** belegt, ist, dass das Client-Binary auf diesem
      # Ziel ueberhaupt startet. Genau das prueft die Startprobe, und
      # ⛑ sie hat beim Bauen sofort etwas gefunden: `myl` gab auf
      # **jeden** unbekannten Befehl die Hilfe aus und dazu null zurueck,
      # eine Startprobe waere also auch dann gruen gewesen, wenn das
      # Binary nichts kann. Seit CLIENT 0.8.1 ist ein Aufruffehler eine
      # 2 auf stderr, gedeckt von `tests/aufruf.rs`.
      - name: Startprobe des Clients
        if: matrix.eigen
        shell: bash
        run: |
          set -e
          BIN="CLIENT/myl-client/target/${{ matrix.ziel }}/release/myl${{ matrix.endung }}"
          "$BIN" --hilfe > /dev/null
          if "$BIN" kein-solcher-befehl > /dev/null 2>&1; then
            echo "FEHLER: myl meldet einen unbekannten Befehl nicht."
            exit 1
          fi
          echo "Start belegt fuer ${{ matrix.ziel }}"

      - name: Ungeprueftes Ziel benennen
        if: ${{ !matrix.eigen }}
        shell: bash
        run: |
          echo "::warning title=Ungeprueft::${{ matrix.ziel }} wurde gebaut, aber nicht"
          echo "ausgefuehrt: Der Runner kann dieses Binary nicht starten. Der"
          echo "Konformitaetswert dieses Ziels ist damit unbelegt."

      - name: Einsammeln
        shell: bash
        run: |
          set -e
          mkdir -p ausgabe
          cp "TESTCLIENT/myl-testclient/target/${{ matrix.ziel }}/release/myl-test${{ matrix.endung }}" \
             "ausgabe/myl-test-${{ matrix.ziel }}${{ matrix.endung }}"
          cp "NODE/myl-node/target/${{ matrix.ziel }}/release/myl-node${{ matrix.endung }}" \
             "ausgabe/myl-node-${{ matrix.ziel }}${{ matrix.endung }}"
          cp "CLIENT/myl-client/target/${{ matrix.ziel }}/release/myl${{ matrix.endung }}" \
             "ausgabe/myl-${{ matrix.ziel }}${{ matrix.endung }}"
          # Ein Ziel, das sich nicht selbst pruefen konnte, wird als
          # solches ausgeliefert und nicht stillschweigend gleichgestellt.
          if [ "${{ matrix.eigen }}" != "true" ]; then
            echo "Dieses Ziel wurde gebaut, aber nicht ausgefuehrt:" > "ausgabe/UNGEPRUEFT-${{ matrix.ziel }}.txt"
            echo "der Runner kann es nicht starten." >> "ausgabe/UNGEPRUEFT-${{ matrix.ziel }}.txt"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.ziel }}
          path: ausgabe/*

  veroeffentlichen:
    name: Veroeffentlichen
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: eingang

      - name: Pruefsummen
        run: |
          set -e
          mkdir -p release
          find eingang -type f -exec cp {} release/ \;
          cd release
          # `sha256sum` gibt es auf Ubuntu; die Ausweichzeile deckt
          # Umgebungen ohne coreutils ab.
          if command -v sha256sum >/dev/null; then
            sha256sum * > PRUEFSUMMEN.txt
          else
            shasum -a 256 * > PRUEFSUMMEN.txt
          fi
          cat PRUEFSUMMEN.txt

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          MARKE="${GITHUB_REF_NAME}"
          gh release create "$MARKE" release/* \
            --title "$MARKE" \
            --notes "Gebaute Binaries für Client (\`myl\`), Testclient (\`myl-test\`) und Knoten (\`myl-node\`).

          \`myl\` ist das Programm für Menschen: eine Frage an ein lokales Modell, die
          Agentenschleife, die Einstellungen. Es braucht ein Modellartefakt, und das liegt
          einem Release nicht bei (mehrere Gigabyte, aus einem Kalibrierungslauf entstanden).
          Die grafische Oberfläche ist nicht dabei; sie braucht je Plattform ein eigenes
          Bündel und wird mit \`werkzeuge/freigabe.sh\` örtlich gebaut.

          **Jedes Binary hat vor der Veröffentlichung belegt, dass es richtig rechnet:**
          Der Konformitätslauf über **siebzehn** Vektoren (Operationen, Training und
          Gemisch) lief mit genau diesem Binary auf dem Rechner, der es gebaut hat, und
          ergab die bekannten Werte.
          Ausnahme ist \`x86_64-apple-darwin\`; der macOS-Runner ist arm64 und kann
          dieses Binary nicht starten. Es liegt eine Datei \`UNGEPRUEFT-*.txt\` dabei.
          Der Lauf gilt \`myl-test\`; \`myl\` und \`myl-node\` binden dieselben Kerne aus
          derselben Quelle, und Ganzzahlarithmetik ist exakt, also verschiebt kein Inlining
          ein Ergebnis. Für \`myl\` ist zusätzlich belegt, dass es auf dem Ziel startet.

          **Die Linux-Binaries binden gegen die glibc des Runners.** Auf einer
          älteren Verteilung starten sie nicht; dort weiterhin selbst übersetzen.

          Prüfsummen in \`PRUEFSUMMEN.txt\`. Sie belegen, dass die Datei unverändert
          ankam, nicht von wem sie stammt."
