# Abhaengigkeitspruefung fuer alle Crates dieses Repositoriums.
#
# Aufruf je Crate, weil es kein gemeinsames Workspace-Manifest gibt:
#
#   (cd <KOMPONENTE>/<crate> && cargo deny --config ../../deny.toml check)
#
# Die CI faehrt dieselbe Schleife ueber alle */*/Cargo.toml und leitet
# die Liste aus dem Dateisystem ab, nicht aus einer getippten Aufzaehlung.
# Ein neues Crate ist damit automatisch dabei.
#
# Warum es diese Datei gibt: Der Baum von myl-node umfasst 284 Crates,
# und bis zum 2026-09-02 hat keines davon jemand gegen eine
# Schwachstellenliste gehalten. Das ist die Art Luecke, die ein externer
# Pruefer als Erstes anspricht, und sie kostet zwei Sekunden je Crate.

[graph]
# Was die Freigabe baut, siehe release.yml. Ohne diese Liste urteilt die
# Pruefung ueber Abhaengigkeiten, die auf keinem Ziel gebaut werden, etwa
# die UEFI- und Windows-Zweige.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]

# Eine zurueckgezogene Fassung ist ein Fehlschlag, keine Warnung. Der
# Grund ist derselbe wie ueberall hier: Eine Warnung, die niemand liest,
# ist keine Pruefung.
yanked = "deny"

# ⚑ Unwartet gilt nur fuer das, woran dieses Projekt etwas aendern kann.
#
# `paste` (RUSTSEC-2024-0436) und `number_prefix` haengen beide
# ausschliesslich transitiv im Baum: `paste` ueber
# libp2p > if-watch > netlink-packet-core, `number_prefix` ueber
# runtime > tokenizers > indicatif. Sie zu melden hiesse, bei jedem Lauf
# etwas anzuzeigen, das niemand hier beheben kann, und nach der dritten
# Wiederholung sieht man weg.
#
# **Fuer eine direkte Abhaengigkeit beisst die Pruefung weiter.** Genau
# das ist die Grenze, die "workspace" zieht.
unmaintained = "workspace"

# ⚑ **Keine Ausnahme.** Bis zum 2026-10-23 stand hier chacha20 0.10.1
# (zurueckgezogen, ueber rand 0.10 im Baum von libp2p). Mit 0.10.2 gibt es
# einen nicht zurueckgezogenen Nachfolger, und die Sperrdateien nehmen ihn.
# Eine neue Ausnahme kommt nur einzeln, mit Kiste, Fassung und Grund, und
# nur, wenn es keine behobene Fassung gibt.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9

# 📌 **„license was not encountered" ist hier keine Auskunft, sondern
# Rauschen, und der Grund ist der Zuschnitt der Pruefung.**
#
# Der CI-Job faehrt `cargo deny` **je Kiste**, dreiundzwanzigmal, gegen
# **diese eine** Datei. Die Liste unten ist damit notwendig eine
# Obermenge: Sie deckt alles ab, was irgendeine der dreiundzwanzig
# mitbringt, und keine einzelne bringt alles mit. `AGENT_LAYER/local-agent`
# hat einen kleinen Baum und trifft weder `Apache-2.0 WITH
# LLVM-exception` noch `BSD-1-Clause` noch `BSD-2-Clause`; das ist
# richtig so und nicht zu beheben.
#
# ⚑ **Warnungen, auf die niemand etwas tun kann, sind teurer als keine:**
# Sie erziehen dazu, die Ausgabe zu ueberfliegen, und dann faellt die
# eine Zeile nicht auf, die etwas bedeutet. Dieselbe Ueberlegung steht
# weiter unten bei `multiple-versions`.
#
# ⚠️ **Was damit verlorengeht:** Eine Lizenz, die in **keiner** Kiste
# mehr vorkommt, wird nicht mehr gemeldet. Wer eine solche tote Zeile
# sucht, nimmt sie heraus und sieht nach, ob ein Lauf rot wird; bleibt
# alles gruen, war sie tot.
unused-allowed-license = "allow"

allow = [
    # Der eigene Code. PolyForm Shield steht nicht in der SPDX-Liste,
    # deshalb die LicenseRef-Form: Sie ist die von SPDX vorgesehene
    # Schreibweise fuer genau diesen Fall und ist maschinenlesbar,
    # anders als der Klartext, der bis zum 2026-09-02 in 16 Manifesten
    # stand und von jedem Werkzeug als "unlicensed" gelesen wurde.
    "LicenseRef-PolyForm-Shield-1.0.0",

    # Freizuegig, ohne Auflagen fuer ein Binaerprogramm.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",

    # ⚑ Schwaches Copyleft, ausdruecklich aufgenommen und nicht uebersehen.
    # MPL-2.0 wirkt je Datei: Wer eine MPL-Datei aendert, gibt sie
    # weiter; unveraendertes Einbinden in ein Binaerprogramm ist frei.
    # Im Baum haengt daran attohttpc, ueber den Modellbezug.
    "MPL-2.0",
]

[bans]
# ⚑ Mehrfache Fassungen sind hier eine Warnung und kein Fehler, und das
# ist eine Feststellung ueber libp2p: Ein Baum mit 284 Crates fuehrt
# unvermeidlich zwei Staende derselben Bibliothek. Ein Fehler daraus
# waere eine Pruefung, die immer rot ist, und die liest niemand.
multiple-versions = "warn"

# Eine Registry-Abhaengigkeit ohne Fassungsangabe ist nicht
# reproduzierbar: Der naechste Bau nimmt, was gerade oben liegt.
wildcards = "deny"

# ⚑ Ausgenommen sind Pfadabhaengigkeiten, und der Grund ist eine Regel
# dieses Projekts. Die neunzehn Crates verweisen ueber `path` aufeinander
# und **ohne** Fassungsangabe. Eine dazuzuschreiben hiesse, dieselbe
# Nummer an zwei Stellen zu fuehren, im Manifest des Abnehmers und im
# Manifest des Lieferanten, und zwei Stellen mit derselben Zahl laufen
# auseinander. Bei einem Pfad gibt es ausserdem nichts festzunageln: Es
# ist genau ein Verzeichnis, und das liegt daneben.
allow-wildcard-paths = true

[sources]
# Alles kommt aus der einen Registry. Eine Git-Abhaengigkeit waere ein
# Stueck Code ohne Fassung und ohne Zurueckziehung, und in einem
# Konsenspfad ist das keine Kleinigkeit.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
