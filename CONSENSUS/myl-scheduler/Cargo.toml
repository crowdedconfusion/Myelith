[package]
name = "myl-scheduler"
version = "0.2.11"
edition = "2021"
rust-version = "1.82"
description = "Deterministischer Epochen-Scheduler für Myelith (Whitepaper Anhang A.2): VRF-Seed-Ableitung, Miner-Filterung, Geo-Clustering, Shard-Zuweisung (Fisher-Yates), Redundanz-Zuteilung, Stichproben-Lotterie. Alle Schritte sind deterministisch und von jedem Node unabhängig nachrechenbar."
license = "PolyForm Shield License 1.0.0"

[dependencies]
borsh = "1.6"
myl-types = { path = "../../SHARED_TYPES/myl-types" }
sha2 = "0.10"

[lib]
name = "myl_scheduler"
path = "src/lib.rs"

[dev-dependencies]
borsh = "1.6"
