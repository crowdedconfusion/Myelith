[package]
name = "myl-testclient"
version = "0.21.0"
edition = "2021"
# ⚑ 1.88 und nicht 1.85 wie die uebrigen Crates, und der Grund liegt
# nicht im eigenen Code: Ueber libp2p haengt hier die `icu_*`-Kette
# (via url/idna) und `time`. `icu` verlangt 1.86, `time` verlangt 1.88.
# Gemessen am 2026-08-29 gegen echte Toolchains mit `--locked`, nicht
# geschaetzt: 1.85 und 1.86 scheitern, 1.88 traegt.
rust-version = "1.88"
description = "Terminal-Testclient für Myelith: Hardware-Erhebung, Cross-Backend-Determinismus und geshardete Inferenz — jeder Lauf mit maschinenlesbarem Protokoll, und ein Vergleichsbefehl, der daraus ein Urteil über den Cross-Hardware-Nachweis fällt."
license = "LicenseRef-PolyForm-Shield-1.0.0"
publish = false

[dependencies]
integer-llm-runtime = { path = "../../INTEGER_LLM/runtime" }
integer-llm-kernels = { path = "../../INTEGER_LLM/kernels" }
myl-pod = { path = "../../COMPUTE_PIPELINE/myl-pod" }
myl-types = { path = "../../SHARED_TYPES/myl-types" }
myl-ledger = { path = "../../CONSENSUS/myl-ledger" }
myl-scheduler = { path = "../../CONSENSUS/myl-scheduler" }
myl-consensus = { path = "../../CONSENSUS/myl-consensus" }
myl-tokenomics = { path = "../../TOKENOMICS/myl-tokenomics" }
myl-verifier = { path = "../../VERIFICATION/myl-verifier" }
# Der Knoten ist eine Bibliothek, keine fremde Datei: Der Testclient
# startet ihn im eigenen Prozess. Ein Partner soll EIN Programm bauen
# und starten, nicht zwei und dazwischen einen Pfad suchen.
myl-node = { path = "../../NODE/myl-node" }
myl-net = { path = "../../NETWORKING/myl-net" }
# ⚑ **Nur fuer die Naht** (2026-09-03): Der Weg von der Tuer bis zum
# Rechenwerk beruehrt fuenf Kisten, und keine sieht mehr als ihren
# Nachbarn. `myl-testclient` ist die einzige Stelle, die alle sieht.
myl-gateway = { path = "../../GATEWAY/myl-gateway" }
myl-siegel = { path = "../../NETWORKING/myl-siegel" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "signal"] }
sha2 = "0.10"
borsh = { version = "1.6", features = ["derive"] }
crossterm = "0.29.0"

# Das Backend wird beim ÜBERSETZEN gewählt, nicht zur Laufzeit: Der
# Rechenpfad kennt keine Verzweigung nach Backend, die Weiche steht als
# `cfg` in `kernels/src/dot.rs`. Ein Laufzeitschalter `--backend` wäre
# deshalb eine Behauptung ohne Deckung.
#
# `cuda` und `rocm` sind aufgeführt, damit ein Bau damit möglich ist und
# der Client ihn ERKENNT. Rechnen tun sie nicht: ihre Umsetzungen
# delegieren an die Referenzkernel. Der Client verweigert Messläufe in
# einem solchen Bau, siehe `hardware::rechenpfad_pruefen`.
[features]
cpu-simd = ["integer-llm-kernels/cpu-simd"]
cuda = ["integer-llm-kernels/cuda"]
rocm = ["integer-llm-kernels/rocm"]

[lib]
name = "myl_testclient"
path = "src/lib.rs"

[[bin]]
name = "myl-test"
path = "src/main.rs"

# Testprofil, siehe die ausfuehrliche Begruendung in
# `SHARED_TYPES/myl-types/Cargo.toml`: optimiert, aber `debug-assertions`
# und `overflow-checks` bleiben an. ⚑ `--release` waere die falsche
# Antwort, weil es beide abschaltet.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
# ⚑ **Weniger Debug-Info, keine Pruefung weniger** (2026-08-29). Volle
# Debug-Info kostete gemessen **26 Prozent Rechenzeit je Bau** und
# **40 Prozent Platz** (`myl-node`: 346 auf 256 Sekunden CPU, 2,5 auf
# 1,5 GB). Der Platz zaehlt doppelt, weil der CI-Cache pro Repositorium
# auf 10 GB gedeckelt ist und ein voller Deckel jeden Job kalt bauen
# laesst.
#
# `line-tables-only` behaelt **Datei und Zeile** in jedem Backtrace, und
# das ist, was man liest. Verloren geht nur das Inspizieren von
# Variablen im Debugger; wer das braucht, setzt lokal `debug = true`.
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"

# ⚑ **Nur die beiden rechnenden Kerne, nicht alle Abhaengigkeiten**
# (2026-08-29). `[profile.dev.package."*"]` stand hier einen Tag lang und
# war zu breit: Es uebersetzte auch `tokio`, `libp2p` und `blst`
# optimiert und kostete damit **40 Prozent mehr Rechenzeit je Bau**
# (gemessen an `myl-node`: 481 statt 344 Sekunden CPU). Auf einem
# Zwei-Kern-Runner schlaegt das voll auf die Wanduhr durch.
#
# Langsam waren die Tests aber nur dort, wo **ganzzahlig gerechnet**
# wird, und das sind diese beiden Crates. Sie sind klein; die grossen
# Abhaengigkeiten bauen wieder unoptimiert.
[profile.dev.package.integer-llm-kernels]
opt-level = 2

[profile.dev.package.integer-llm-runtime]
opt-level = 2

[dev-dependencies]
# ⚑ **Zum Lesen der Antwort im Naht-Test.** Eine Antwort mit `find` und
# Indizes zu zerlegen ist ein zweiter Zerleger, und der erste Entwurf des
# Tests hat sich damit prompt vertan: Er las den halben Rumpf als
# `content`. Wer eine Form prueft, prueft sie mit demselben Werkzeug, mit
# dem ein Klient sie liest.
serde_json = "1.0"
