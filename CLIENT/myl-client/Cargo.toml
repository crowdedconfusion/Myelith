[package]
name = "myl-client"
version = "0.31.0"
edition = "2021"
rust-version = "1.85"
description = "Der Nutzer-Client: eine Frage an ein lokales Modell, die Agentenschleife mit Einhaengegrenze, die Einstellungen."
license = "LicenseRef-PolyForm-Shield-1.0.0"
publish = false

# ⚑ **Hier darf das Modelllaufwerk liegen, in `local-agent` nicht.**
# Jene Kiste traegt eine Vollmacht und haelt ihre Angriffsflaeche klein;
# diese ist die Anwendung und bringt zusammen, was der Nutzer braucht.
# Genau dafuer gibt es das Merkmal `Modellweg` (CLIENT 0.2).
# ⚑ **Diese Kiste wird ausgeliefert.**
#
# Die Installationsskripte in der Wurzel und das oertliche
# Freigabeskript lesen diese Marke; **keines von ihnen fuehrt eine
# eigene Liste mehr**. Bis zum 2026-09-10 taten sie es, vier Stueck,
# und zwei davon waren am ersten Tag schon uneinig (Fund 300).
#
# ⚠️ **Wer sie entfernt, liefert die Kiste nicht mehr aus**, und das
# faellt niemandem auf, ausser der Pruefung
# `was_ausgeliefert_wird_steht_bei_der_kiste`.
#
# Das Bedieninstrument: `myl frage`, `myl agent`, `myl einstellungen`.
[package.metadata.myelith]
ausliefern = "myl"

[dependencies]
myl-local-agent = { path = "../../AGENT_LAYER/local-agent" }
myl-agent = { path = "../../AGENT_LAYER/myl-agent" }
myl-types = { path = "../../SHARED_TYPES/myl-types" }
# ⚑ **Mit `cpu-simd`, und auf macOS mit `metal`** (Fund 367, 2026-09-14).
# Bis zu diesem Tag stand die Runtime hier ohne Feature und rechnete damit
# auf dem skalaren Referenzpfad: gemessen 25 bis 35 Prozent langsamer als
# `cpu-simd`, und die Vorbereitung eines Prompts von 219 Token beim 0,6B
# 5,2 s statt 1,0 s. Beide Features rechnen bitgleich zur Referenz, belegt
# durch den Konformitaetslauf. Auf einem Ziel ohne NEON ist `cpu-simd`
# wirkungslos und die Referenz rechnet, wie vorher.
integer-llm-runtime = { path = "../../INTEGER_LLM/runtime", features = ["cpu-simd"] }
# ⚑ Nur fuer das eine Feld `family` aus `model_config.json`. Das
# Laufwerk gibt es nicht heraus, und es dafuer zu aendern waere ein
# Eingriff in den Rechenpfad fuer eine Anzeigefrage.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ⚑ **Fuer den Hardwarescan und die Plattenreservierung**, und die
# Abhaengigkeitsflaeche waechst dabei um **null Kisten**: `libc` stand
# vor dieser Zeile schon in beiden Sperrdateien, durchgereicht von
# anderen. Direkt eingetragen wird nur, was ohnehin gebaut wird.
#
# ⚑ **Nur unter Unix.** Unter Windows traegt `File::set_len` die
# Reservierung von selbst, denn `SetEndOfFile` belegt auf NTFS wirklich;
# auf Unix legte dieselbe Zeile eine Datei mit Loechern an, die nichts
# belegt. Zwei Systeme, ein Zweck, zwei Wege, und der Unterschied steht
# in `reservierung.rs` ausgeschrieben.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Die gebuendelten Matrizen der Vorbereitung auf der GPU. Die Runtime
# prueft die GPU beim ersten Gebrauch gegen die CPU und rechnet ohne sie
# weiter, wenn sie abweicht oder fehlt.
[target.'cfg(target_os = "macos")'.dependencies]
integer-llm-runtime = { path = "../../INTEGER_LLM/runtime", features = ["cpu-simd", "metal"] }

# ⚑ Nur fuer die Pruefungen der Einhaengegrenze: Sie brauchen ein
# echtes Verzeichnis, denn `canonicalize` loest gegen das Dateisystem
# auf. Eine nachgebaute Ablage pruefte genau das nicht, worum es geht.
[dev-dependencies]
tempfile = "3"

[features]
cuda = ["integer-llm-runtime/cuda"]
rocm = ["integer-llm-runtime/rocm"]

# Testprofil, siehe die ausfuehrliche Begruendung in
# `SHARED_TYPES/myl-types/Cargo.toml`: optimiert, aber
# `debug-assertions` und `overflow-checks` bleiben an. ⚑ `--release`
# waere die falsche Abkuerzung, denn es schaltet genau die Pruefungen
# ab, um deretwillen man prueft.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
