[package]
name = "myl-module"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Module der Konsole: Protokoll, Beschreibung, Signatur und Wirt"
license = "LicenseRef-PolyForm-Shield-1.0.0"
publish = false

# ⚑ **Eine eigene Kiste, damit beide Seiten dieselbe Sprache sprechen.**
#
# Die Konsole bindet sie als Wirt ein, ein Modul als Gast. Zwei getippte
# Fassungen derselben Nachrichten waeren die Fehlerklasse, die dieses
# Repositorium am haeufigsten trifft: Was an zwei Orten steht, laeuft
# auseinander, und der zweite Ort meldet sich nicht.
#
# ⚑ **Sie haengt nicht an `myl-client`.** Ein Modul soll sie einbinden
# koennen, ohne die Konsole mitzuziehen.

[[bin]]
name = "myl-module"
path = "src/bin/myl-module.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
getrandom = "0.2"

[dev-dependencies]

# ⛔️ **Geprueft wird mit `cargo test`, nie mit `--release`.** Dieses
# Profil optimiert trotzdem, haelt aber `debug-assertions` und
# `overflow-checks` an; `--release` schaltet genau die beiden Schalter
# ab, die Ueberlaeufe finden.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
