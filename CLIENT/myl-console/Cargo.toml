[package]
name = "myl-console"
version = "0.15.0"
# ⚑ **2021 wie alle anderen Kisten hier.** Mit 2024 meldet `clippy`
# andere Regeln, und dann traegt dieselbe Zeile in zwei Kisten einmal
# einen Fehler und einmal nicht. **Eine Ausgabe je Repositorium**,
# solange nicht jemand alle umstellt.
edition = "2021"
# ⚑ **1.88 und nicht 1.85 wie die meisten Kisten**, und der Grund liegt
# im eigenen Code: `farben.rs` ruft `u64::is_multiple_of`, und das ist
# erst seit 1.87 stabil. Gemessen am 2026-09-10 gegen echte
# Toolchains, nicht geschaetzt: 1.85 und 1.86 scheitern mit
# `unstable library feature`, 1.88 traegt.
#
# ⚠️ **Die Matrix der CI deckt 1.85 und 1.88 ab**, und diese Zeile muss
# eine der beiden nennen; wer eine dritte einsetzt, bekommt einen Job,
# der die Kiste stillschweigend uebergeht.
rust-version = "1.88"
description = "Myelith in der Konsole: der Agent im Arbeitsverzeichnis"
license = "LicenseRef-PolyForm-Shield-1.0.0"
publish = false

# ⚑ **Diese Kiste wird ausgeliefert.**
#
# Die Installationsskripte in der Wurzel und das oertliche
# Freigabeskript lesen diese Marke; keines von ihnen fuehrt eine eigene
# Liste (Fund 300).
#
# ⚠️ **Wer sie entfernt, liefert die Kiste nicht mehr aus**, und das
# faellt niemandem auf, ausser der Pruefung
# `was_ausgeliefert_wird_steht_bei_der_kiste`.
#
# ⚑ **Das Programm heisst `myelith` und nicht `myl-console`.** Es ist
# das, was ein Mensch in ein Verzeichnis tippt; der Kistenname ist eine
# Angelegenheit des Bauwerkzeugs.
[package.metadata.myelith]
ausliefern = "myelith"

[[bin]]
name = "myelith"
path = "src/main.rs"

[dependencies]
# ⚑ **Der ganze oertliche Betrieb kommt von hier**, samt Agentenlauf,
# Einstellungen, Modell und Ortsbestimmung. Diese Kiste ist eine
# Bedienoberflaeche und hat keine eigene Logik; genau wie das Fenster.
myl-client = { path = "../myl-client" }
myl-senses = { path = "../myl-senses" }

# ⚑ **Fuer Marke, Farben und Auswahl im Terminal.** Dieselbe Fassung
# wie im Testclient, aus dem die Animation stammt; `fassungsprobe.py`
# haelt fest, dass es dabei bleibt.
crossterm = "0.29.0"

# Testprofil, siehe die ausfuehrliche Begruendung in
# `SHARED_TYPES/myl-types/Cargo.toml`: optimiert, aber
# `debug-assertions` und `overflow-checks` bleiben an. ⚑ `--release`
# waere die falsche Abkuerzung, denn es schaltet genau die Pruefungen
# ab, um deretwillen man prueft.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"

# ⚑ **Nur fuer `geteuid`**, also fuer die eine Auskunft, ob dieser Lauf
# Verwalterrechte hat. ⚑ Die Abhaengigkeitsflaeche waechst dabei um
# **null Kisten**: `libc` steht ueber `myl-client` schon in der
# Sperrdatei.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
