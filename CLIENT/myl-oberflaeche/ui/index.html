<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myelith</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>

<!-- ⚑ Das Vorschaltbild traegt eine echte Wartezeit: Ein Artefakt
     dieser Groesse laedt rund elf Sekunden. Aus grauem Rauschen wird
     ein Wirbel, aus dessen Mitte das Netz waechst. -->
<div id="vorhang">
  <canvas id="netz" aria-hidden="true"></canvas>
  <div class="vorhangtext">
    <p class="wortmarke">Myelith</p>
    <div class="zeile"></div>
    <p id="vorhangstand" role="status">wird geladen</p>
  </div>
</div>

<!-- ⚑ **Die Meldungen liegen ueber allem und nicht in einer Maske.**
     Ein Ereignis, das man nur sieht, wenn man zufaellig auf der
     richtigen Seite steht, ist keine Meldung. Sie stehen oben rechts,
     jede fuer sich schliessbar. -->
<div id="meldungen" role="status" aria-live="polite"></div>

<div id="huelle">

  <!-- ⚑ Die Seitenleiste traegt zwei Listen und in dieser Reihenfolge:
       oben die Betriebsart, darunter die Gespraeche. Der Grund ist,
       dass die Betriebsart bestimmt, WAS ein Gespraech ist: In `Frage`
       traegt es den Verlauf mit, beim Agenten steht jeder Auftrag fuer
       sich. Wer die Gespraeche zuerst saehe, waehlte in einem Zustand,
       den er noch nicht kennt. -->
  <aside id="seitenleiste" aria-label="Gespraeche und Betriebsart">
    <!-- ⚑ **Die Marke ist gerechnet und nicht gezeichnet**, erzeugt von
         `werkzeuge/marke.py`: Fibonacci-Quadrate, tangentenstetige
         Viertelkreise darin, dazu das Rechteck, das sie aufspannen.
         Weisse Linien auf durchsichtigem Grund; die Farbe kommt aus
         `currentColor`.

         ⛑ **Nicht von Hand nachbessern.** Wer etwas aendern will,
         aendert das Skript und legt die Ausgabe hier wieder ab; sonst
         ist die Geometrie beim naechsten Lauf wieder da, die Aenderung
         aber weg. -->
<div class="leistenkopf">
<svg class="spirale" viewBox="0 0 161.90 100.00" fill="none" aria-hidden="true" focusable="false">
<g class="geruest" stroke="currentColor" stroke-width="1.60" fill="none">
<rect x="114.23" y="70.91" width="4.65" height="4.65"/>
<rect x="118.88" y="70.91" width="4.65" height="4.65"/>
<rect x="114.23" y="61.62" width="9.30" height="9.30"/>
<rect x="100.29" y="61.62" width="13.94" height="13.94"/>
<rect x="100.29" y="75.56" width="23.24" height="23.24"/>
<rect x="123.52" y="61.62" width="37.18" height="37.18"/>
<rect x="100.29" y="1.20" width="60.42" height="60.42"/>
<rect x="2.69" y="1.20" width="97.60" height="97.60"/>
</g>
<path class="bogen" d="M114.23 70.91 A4.65 4.65 0 0 0 118.88 75.56 A4.65 4.65 0 0 0 123.52 70.91 A9.30 9.30 0 0 0 114.23 61.62 A13.94 13.94 0 0 0 100.29 75.56 A23.24 23.24 0 0 0 123.52 98.80 A37.18 37.18 0 0 0 160.70 61.62 A60.42 60.42 0 0 0 100.29 1.20 A97.60 97.60 0 0 0 2.69 98.80" stroke="currentColor" stroke-width="1.60"
      fill="none" stroke-linecap="butt"/>
</svg>
      <!-- ⚑ **Ein Buchstabe je `span`, damit der Zug die Breite der
           Marke genau ausfuellt.** Die Lueckenverteilung uebernimmt
           `justify-content: space-between`: Der erste und der letzte
           Buchstabe stehen damit buendig an den Kanten der Spiralbox,
           und die Sperrung faellt aus der Breite statt geraten zu
           werden. `letter-spacing` traefe nur zufaellig, denn es haengt
           an den Metriken der jeweiligen Systemschrift.

           Der Zug bleibt als Wort lesbar: `aria-label` traegt ihn, die
           Buchstaben sind fuer die Vorlesehilfe versteckt. -->
      <p class="wortmarke gespreizt" aria-label="Myelith"><span aria-hidden="true">M</span><span aria-hidden="true">y</span><span aria-hidden="true">e</span><span aria-hidden="true">l</span><span aria-hidden="true">i</span><span aria-hidden="true">t</span><span aria-hidden="true">h</span></p>
    </div>

    <nav class="leistenteil" aria-label="Betriebsart">
      <h2>Modus</h2>
      <div id="modi" role="radiogroup" aria-label="Betriebsart"></div>
      <!-- ⚑ **Worauf der Agent zugreifen darf, bevor der Auftrag
           laeuft.** Die Marke im Kopf sagt „liest und schreibt", aber
           nicht WORAUF. Das hier ist die einzige Stelle, an der die
           Einhaengegrenze fuer einen Menschen sichtbar wird. -->
      <div id="reichweite"></div>
    </nav>

    <div class="leistenteil chats">
      <h2>Gespraeche</h2>
      <button id="neues-gespraech" class="breit">Neues Gespraech</button>
      <div id="chatliste" role="list"></div>
    </div>

    <div class="leistenfuss">
      <h2>Modell</h2>
      <select id="modellwahl" aria-label="Modell"></select>
      <p id="modellzeile" class="pfad">kein Modell geladen</p>
      <button id="laden">Modell laden</button>
    </div>
  </aside>

  <div id="haupt">
    <header>
      <button id="leiste-schalten" class="rundknopf" aria-label="Seitenleiste ein- und ausblenden"
              aria-expanded="true" aria-controls="seitenleiste">
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M3 5.5h14M3 10h14M3 14.5h14"/>
        </svg>
      </button>

      <!-- ⛑ **Hier stand ein Schalter „Lokal | Netz".** Er ist am
           2026-09-09 entfallen, auf Festlegung des Projektinhabers,
           und die Begruendung traegt: Ein Modell ist ein Modell, ob es
           auf dieser Maschine liegt oder im Netz gerechnet wird. Die
           Wahl gehoert damit in die Modellwahl unten links und nicht
           in einen zweiten Schalter, der dasselbe noch einmal fragt.
           Der Netzeintrag heisst dort „API (kostet Inferenz-Credits)"
           und ist gesperrt, bis Knotenadresse und Vollmacht da sind. -->


      <!-- ⛑ **Der erste Entwurf zeichnete eine Sonne.** Acht Strahlen
           aus der Mitte heraus plus ein Kreis ist das Zeichen fuer
           Helligkeit, nicht fuer Einstellungen, und wer es sieht, sucht
           dahinter einen Hell-Dunkel-Schalter. Ein Zahnrad hat einen
           Koerper und Zaehne AUSSEN daran: zwei Kreise und acht kurze
           Segmente zwischen Radius 5,4 und 7,4. -->
      <div class="kopfrechts">
        <span id="betriebsart" class="marke">wird geladen</span>
        <button id="zu-einstellungen" class="rundknopf" aria-label="Einstellungen">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <circle cx="10" cy="10" r="5.4"/>
            <circle cx="10" cy="10" r="2.3"/>
            <path d="M15.4 10h2M13.82 13.82l1.41 1.41M10 15.4v2M6.18 13.82l-1.41 1.41M4.6 10h-2M6.18 6.18L4.77 4.77M10 4.6v-2M13.82 6.18l1.41-1.41"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Das Gespraech. -->
    <main id="gespraech" role="log" aria-live="polite"></main>

    <!-- ⚑ Die Eingabezeile klebt unten und nicht im Fluss: Wer nach
         oben scrollt, um etwas nachzulesen, soll nicht erst wieder
         herunterscrollen muessen, um zu antworten. -->
    <form id="eingabe">
      <div class="eingabefeld">
        <textarea id="auftrag" rows="1" autocomplete="off"
                  placeholder="Frag etwas, oder gib einen Auftrag."
                  aria-label="Eingabe"></textarea>
        <button type="submit" id="senden" class="rundknopf senden" aria-label="Senden">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M10 16V4M10 4L5 9M10 4l5 5"/>
          </svg>
        </button>
      </div>
      <p id="hinweiszeile" class="pfad" role="status"></p>
    </form>

    <!-- ⚑ Die Einstellungen sind eine SEITE und kein Ausklapper. Sie
         nehmen den ganzen Raum, weil man sie nicht nebenbei bedient,
         und das Gespraech bleibt derweil stehen. -->
    <section id="einstellungsseite" hidden aria-label="Einstellungen">
      <div class="seitenkopf">
        <h1>Einstellungen</h1>
        <button id="zurueck" class="rundknopf" aria-label="Zurueck zum Gespraech">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M5 5l10 10M15 5L5 15"/>
          </svg>
        </button>
      </div>
      <!-- ⚑ **Modelle holen und Artefakte bauen, aus der Oberflaeche.**
           Bis zum 2026-09-09 war `modell.artefakt` ein Textfeld: ein
           Pfad, den jemand von Hand eintraegt und der existieren muss.
           Wer die Freigabe-Binaries laedt, hatte kein Artefakt und
           keinen Weg zu einem, ohne die Kommandozeile. -->
      <section id="modellbau">
        <h2>Modelle</h2>
        <p id="bauhinweis" class="pfad"></p>
        <div id="katalog"></div>
        <!-- ⚑ Er steht hier und wird beim Bauen in die Zeile des
             betroffenen Modells verschoben. Ein Balken je Zeile waere
             vier Balken, von denen drei nie etwas zeigen. -->
        <div id="baustand" hidden>
          <div class="balken"><span id="balkenteil"></span></div>
          <p id="bauphase" class="pfad"></p>
          <pre id="bauzeilen" aria-live="polite"></pre>
        </div>
      </section>

      <h2>Einstellungen</h2>
      <table id="einstellungen"><tbody></tbody></table>
      <p class="pfad" id="pfad"></p>
      <p class="pfad" id="setzmeldung" role="status"></p>
    </section>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
