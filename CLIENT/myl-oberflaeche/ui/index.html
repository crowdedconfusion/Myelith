<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myelith</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>

<!-- ⚑ Das Vorschaltbild traegt eine echte Wartezeit: Ein Artefakt
     dieser Groesse laedt rund elf Sekunden. Aus grauem Rauschen wird
     ein Wirbel, aus dessen Mitte das Netz waechst. -->
<div id="vorhang">
  <canvas id="netz" aria-hidden="true"></canvas>
  <div class="vorhangtext">
    <p class="wortmarke">Myelith</p>
    <div class="zeile"></div>
    <p id="vorhangstand" role="status">wird geladen</p>
  </div>
</div>

<div id="huelle">

  <!-- ⚑ Die Seitenleiste traegt zwei Listen und in dieser Reihenfolge:
       oben die Betriebsart, darunter die Gespraeche. Der Grund ist,
       dass die Betriebsart bestimmt, WAS ein Gespraech ist: In `Frage`
       traegt es den Verlauf mit, beim Agenten steht jeder Auftrag fuer
       sich. Wer die Gespraeche zuerst saehe, waehlte in einem Zustand,
       den er noch nicht kennt. -->
  <aside id="seitenleiste" aria-label="Gespraeche und Betriebsart">
    <!-- ⚑ **Die Marke ist gerechnet und nicht gezeichnet**, erzeugt von
         `werkzeuge/marke.py`: Fibonacci-Quadrate, Viertelkreise darin,
         und zwei Arme, punktsymmetrisch um das Auge (die „Dual Phi
         Spiral"). Die Sterne stehen mit festem Wuerfel, sind also bei
         jedem Lauf dieselben.

         ⛑ **Nicht von Hand nachbessern.** Wer etwas aendern will,
         aendert das Skript und legt die Ausgabe hier wieder ab; sonst
         ist die Geometrie beim naechsten Lauf wieder da, die Aenderung
         aber weg. -->
    <div class="leistenkopf">
<svg class="spirale" viewBox="0 0 100 100" fill="none" aria-hidden="true" focusable="false">
<defs>
<filter id="myl-gas" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
<!-- ⚑ Zwei Frequenzen uebereinander: die grobe gibt die Wolken, die
     feine die Koernung. Eine allein sieht entweder nach Watte oder
     nach Rauschen aus. -->
<feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="5" seed="7" result="grob"/>
<feTurbulence type="fractalNoise" baseFrequency="0.19" numOctaves="3" seed="19" result="fein"/>
<feBlend in="grob" in2="fein" mode="overlay" result="w"/>
<feColorMatrix in="w" type="matrix"
  values="0 0 0 0 0.93  0 0 0 0 0.95  0 0 0 0 0.97  1.05 0.55 0.2 0 -0.52"/>
</filter>
<!-- ⚑ Am Auge der Spirale ausgerichtet und nicht an der Mitte des
     Kastens: Sonst leuchtet das Gas woanders als der Kern, und die
     Galaxie haette zwei Zentren. -->
<radialGradient id="myl-huelle" gradientUnits="userSpaceOnUse"
                cx="50.00" cy="50.00" r="58">
<stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
<stop offset="42%" stop-color="#fff" stop-opacity="0.55"/>
<stop offset="78%" stop-color="#fff" stop-opacity="0.10"/>
<stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<filter id="myl-weich" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="4.5"/>
</filter>
<!-- ⛑ **Die Maske ist nicht rund, sie folgt den Armen.** Eine
     Spiralgalaxie traegt ihr helles Gas IN den Armen; eine runde
     Wolke daraus zu machen war der groesste Unterschied zur
     Aufnahme. Grundhelligkeit aus dem Verlauf, darueber zwei breite,
     weichgezeichnete Kopien der Bahn. -->
<mask id="myl-maske">
<rect x="0" y="0" width="100" height="100" fill="url(#myl-huelle)" opacity="0.55"/>
<g filter="url(#myl-weich)" fill="none" stroke="#fff" stroke-width="15"
   stroke-linecap="round" opacity="0.62">
<path d="M50.00 47.07 A2.93 2.93 0 0 0 47.07 50.00 A2.93 2.93 0 0 0 50.00 52.93 A5.87 5.87 0 0 0 55.87 47.07 A8.80 8.80 0 0 0 47.07 38.27 A14.67 14.67 0 0 0 32.40 52.93 A23.47 23.47 0 0 0 55.87 76.40 A38.13 38.13 0 0 0 94.00 38.27"/>
<path d="M50.00 47.07 A2.93 2.93 0 0 0 47.07 50.00 A2.93 2.93 0 0 0 50.00 52.93 A5.87 5.87 0 0 0 55.87 47.07 A8.80 8.80 0 0 0 47.07 38.27 A14.67 14.67 0 0 0 32.40 52.93 A23.47 23.47 0 0 0 55.87 76.40 A38.13 38.13 0 0 0 94.00 38.27" transform="rotate(180 50.00 50.00)"/>
</g>
</mask>
<radialGradient id="myl-kern" gradientUnits="userSpaceOnUse" cx="50.00" cy="50.00" r="34">
<stop offset="0%" stop-color="currentColor" stop-opacity="0.34"/>
<stop offset="35%" stop-color="currentColor" stop-opacity="0.11"/>
<stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
</radialGradient>
</defs>

    <nav class="leistenteil" aria-label="Betriebsart">
      <h2>Modus</h2>
      <div id="modi" role="radiogroup" aria-label="Betriebsart"></div>
    </nav>

    <div class="leistenteil chats">
      <h2>Gespraeche</h2>
      <button id="neues-gespraech" class="breit">Neues Gespraech</button>
      <div id="chatliste" role="list"></div>
    </div>

    <div class="leistenfuss">
      <p id="modellzeile" class="pfad">kein Modell geladen</p>
      <button id="laden">Modell laden</button>
    </div>
  </aside>

  <div id="haupt">
    <header>
      <button id="leiste-schalten" class="rundknopf" aria-label="Seitenleiste ein- und ausblenden"
              aria-expanded="true" aria-controls="seitenleiste">
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M3 5.5h14M3 10h14M3 14.5h14"/>
        </svg>
      </button>

      <!-- ⚑ Oben mittig, weil es die Frage ist, die ueber allem
           anderen steht: Rechnet diese Maschine, oder rechnet das Netz?
           Alles darunter, Modus wie Gespraech, haengt daran. -->
      <div id="ort" class="schalter" role="radiogroup" aria-label="Wo gerechnet wird">
        <button type="button" data-ort="lokal" role="radio" aria-checked="true">Lokal</button>
        <button type="button" data-ort="netz" role="radio" aria-checked="false">Netz</button>
        <span class="reiter" aria-hidden="true"></span>
      </div>

      <!-- ⛑ **Der erste Entwurf zeichnete eine Sonne.** Acht Strahlen
           aus der Mitte heraus plus ein Kreis ist das Zeichen fuer
           Helligkeit, nicht fuer Einstellungen, und wer es sieht, sucht
           dahinter einen Hell-Dunkel-Schalter. Ein Zahnrad hat einen
           Koerper und Zaehne AUSSEN daran: zwei Kreise und acht kurze
           Segmente zwischen Radius 5,4 und 7,4. -->
      <div class="kopfrechts">
        <span id="betriebsart" class="marke">wird geladen</span>
        <button id="zu-einstellungen" class="rundknopf" aria-label="Einstellungen">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <circle cx="10" cy="10" r="5.4"/>
            <circle cx="10" cy="10" r="2.3"/>
            <path d="M15.4 10h2M13.82 13.82l1.41 1.41M10 15.4v2M6.18 13.82l-1.41 1.41M4.6 10h-2M6.18 6.18L4.77 4.77M10 4.6v-2M13.82 6.18l1.41-1.41"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Das Gespraech. -->
    <main id="gespraech" role="log" aria-live="polite"></main>

    <!-- ⚑ Die Eingabezeile klebt unten und nicht im Fluss: Wer nach
         oben scrollt, um etwas nachzulesen, soll nicht erst wieder
         herunterscrollen muessen, um zu antworten. -->
    <form id="eingabe">
      <div class="eingabefeld">
        <textarea id="auftrag" rows="1" autocomplete="off"
                  placeholder="Frag etwas, oder gib einen Auftrag."
                  aria-label="Eingabe"></textarea>
        <button type="submit" id="senden" class="rundknopf senden" aria-label="Senden">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M10 16V4M10 4L5 9M10 4l5 5"/>
          </svg>
        </button>
      </div>
      <p id="hinweiszeile" class="pfad" role="status"></p>
    </form>

    <!-- ⚑ Die Einstellungen sind eine SEITE und kein Ausklapper. Sie
         nehmen den ganzen Raum, weil man sie nicht nebenbei bedient,
         und das Gespraech bleibt derweil stehen. -->
    <section id="einstellungsseite" hidden aria-label="Einstellungen">
      <div class="seitenkopf">
        <h1>Einstellungen</h1>
        <button id="zurueck" class="rundknopf" aria-label="Zurueck zum Gespraech">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M5 5l10 10M15 5L5 15"/>
          </svg>
        </button>
      </div>
      <table id="einstellungen"><tbody></tbody></table>
      <p class="pfad" id="pfad"></p>
      <p class="pfad" id="setzmeldung" role="status"></p>
    </section>
  </div>
</div>

<script type="module" src="app.js"></script>
