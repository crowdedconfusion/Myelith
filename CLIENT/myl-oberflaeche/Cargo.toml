[package]
name = "myl-oberflaeche"
version = "0.27.2"
edition = "2021"
rust-version = "1.88"
description = "Die grafische Oberflaeche des Clients auf Tauri: ein Gespraechsfenster, das dieselben Funktionen ruft wie die Kommandozeile."
license = "LicenseRef-PolyForm-Shield-1.0.0"
publish = false

# ⚑ **Der Ruecken ruft die Kiste, nicht das Binaerprogramm.** „Die
# Oberflaeche ruft dieselben Unterbefehle, ohne eigene Logik" heisst
# nicht, dass sie `myl` als Unterprozess startet: Dann muesste sie
# dessen Ausgabe wieder zerlegen, und aus einer Textausgabe fuer
# Menschen eine Schnittstelle zu machen ist genau die Sorte Logik, die
# hier nicht hingehoert. Sie ruft dieselben Funktionen.
# ⚑ **Diese Kiste wird ausgeliefert.**
#
# Die Installationsskripte in der Wurzel und das oertliche
# Freigabeskript lesen diese Marke; **keines von ihnen fuehrt eine
# eigene Liste mehr**. Bis zum 2026-09-10 taten sie es, vier Stueck,
# und zwei davon waren am ersten Tag schon uneinig (Fund 300).
#
# ⚠️ **Wer sie entfernt, liefert die Kiste nicht mehr aus**, und das
# faellt niemandem auf, ausser der Pruefung
# `was_ausgeliefert_wird_steht_bei_der_kiste`.
#
# Das Fenster. Unter macOS wird daraus zusaetzlich `Myelith.app`.
[package.metadata.myelith]
ausliefern = "myl-oberflaeche"

[dependencies]
myl-client = { path = "../myl-client" }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Testprofil, siehe die ausfuehrliche Begruendung in
# `SHARED_TYPES/myl-types/Cargo.toml`: optimiert, aber
# `debug-assertions` und `overflow-checks` bleiben an.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
