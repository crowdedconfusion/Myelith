[package]
name = "myl-node"
version = "0.11.0"
edition = "2021"
rust-version = "1.85"
description = "Der Myelith-Knoten: die Verdrahtung, die aus den Protokoll-Bibliotheken ein laufendes Programm macht. Identität, Konfiguration, Netzanbindung über myl-net (L0), Nutzlastprüfung gegen myl-consensus (L1) und ein Betriebsprotokoll im JSONL-Format für die nachträgliche Fehlersuche über mehrere Maschinen hinweg."
license = "PolyForm Shield License 1.0.0"

[dependencies]
borsh = { version = "1.6", features = ["derive"] }
getrandom = "0.3"
myl-net = { path = "../../NETWORKING/myl-net" }
myl-types = { path = "../../SHARED_TYPES/myl-types" }
myl-consensus = { path = "../../CONSENSUS/myl-consensus" }
myl-ledger = { path = "../../CONSENSUS/myl-ledger" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync", "signal"] }
libp2p = { version = "0.56", features = ["tokio"] }

[lib]
name = "myl_node"
path = "src/lib.rs"

[[bin]]
name = "myl-node"
path = "src/main.rs"

# Testprofil, siehe die ausfuehrliche Begruendung in
# `SHARED_TYPES/myl-types/Cargo.toml`: optimiert, aber `debug-assertions`
# und `overflow-checks` bleiben an. ⚑ `--release` waere die falsche
# Antwort, weil es beide abschaltet.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2
