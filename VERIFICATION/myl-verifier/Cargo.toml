[package]
name = "myl-verifier"
version = "0.5.0"
edition = "2021"
rust-version = "1.82"
description = "Verifikations-Subsystem für Myelith (Whitepaper Kap. 6.4–6.9, Anhang A.4): Redundanzvergleich, Bisektions-Spiel, Kontrollsegmente. Nutzt INTEGER_LLMs Determinismus-Eigenschaft für wirtschaftliche Manipulationssicherung."
license = "PolyForm Shield License 1.0.0"

[dependencies]
myl-types = { path = "../../SHARED_TYPES/myl-types" }
myl-ledger = { path = "../../CONSENSUS/myl-ledger" }
myl-scheduler = { path = "../../CONSENSUS/myl-scheduler" }
sha2 = "0.10"
borsh = { version = "1.6", features = ["derive"] }

[lib]
name = "myl_verifier"
path = "src/lib.rs"

[dev-dependencies]
