[package]
name = "myl-train"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Trainingsschicht für Myelith (Whitepaper Kap. 7). Enthält vorerst die Datenprovenienz (Kap. 7.3): Merkle-verankerte kanonische Korpora, Segmentreferenz per Beweis statt Rohdaten, gebündelte Beweise und VRF-gesteuerte Zuweisung. Prüft Herkunft, nicht Inhalt."
license = "PolyForm Shield License 1.0.0"

[dependencies]
myl-types = { path = "../../SHARED_TYPES/myl-types" }

[lib]
name = "myl_train"
path = "src/lib.rs"
