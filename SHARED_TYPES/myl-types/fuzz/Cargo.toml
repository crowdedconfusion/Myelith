# Fuzz-Ziele fuer myl-types. Eigenes Crate, weil `libfuzzer-sys` eine
# Nightly-Werkzeugkette braucht und die uebrigen neunzehn Crates auf
# stable uebersetzen (Mindestfassung 1.85).
#
# ⚑ Die Ziele selbst stehen NICHT hier, sondern in
# `../tests/fuzzziele/mod.rs`, und werden per `include!` eingebunden.
# Der stabile Regressionslauf `../tests/fuzzkorpus.rs` bindet dieselbe
# Datei als Modul ein. Zwei Fassungen desselben Ziels waeren zwei
# Wahrheiten, und der Fuzzer faende dann etwas, das die Regression
# hinterher nicht festhaelt.
#
# Aufruf (Nightly noetig):
#   cargo +nightly fuzz run segment -- -max_total_time=60
#   cargo +nightly fuzz list

[package]
name = "myl-types-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "LicenseRef-PolyForm-Shield-1.0.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
borsh = { version = "1.6", features = ["derive"] }

[dependencies.myl-types]
path = ".."

# Ein Fuzz-Ziel ohne Optimierung findet ein Zehntel der Pfade in
# derselben Zeit. Ueberlaufpruefungen bleiben an, denn ein stiller
# Ueberlauf ist genau das, wonach hier gesucht wird.
[profile.release]
debug = 1
overflow-checks = true

[workspace]
members = ["."]

[[bin]]
name = "segment"
path = "fuzz_targets/segment.rs"
test = false
doc = false
bench = false

