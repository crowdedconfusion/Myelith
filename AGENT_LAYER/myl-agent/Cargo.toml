[package]
name = "myl-agent"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
description = "Agent Layer für Myelith (Whitepaper Kap. 8): Skill- und Werkzeug-Manifeste mit Herkunftsstufe, damit einem Segment anzusehen ist, ob es nachrechenbar oder nur bezeugt ist."
license = "PolyForm Shield License 1.0.0"

[dependencies]
borsh = { version = "1.6", features = ["derive"] }
myl-types = { path = "../../SHARED_TYPES/myl-types" }

[lib]
name = "myl_agent"
path = "src/lib.rs"

# Testprofil, siehe die ausfuehrliche Begruendung in
# `SHARED_TYPES/myl-types/Cargo.toml`: optimiert, aber `debug-assertions`
# und `overflow-checks` bleiben an. ⚑ `--release` waere die falsche
# Antwort, weil es beide abschaltet.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2
