[package]
name = "myl-tokenomics"
version = "0.10.0"
edition = "2021"
rust-version = "1.85"
description = "Tokenomik-Berechnungen für Myelith (Whitepaper Kap. 5): Prägefunktion, Verteilung, Credit-Preisbildung, Staking/Slashing-Matrix. Durchgehend Fixed-Point-Ganzzahl-Arithmetik (Brüche als Zähler/Nenner-Paare) — jede Formel ist ein Ledger-Zustandsübergang und muss auf jedem Node bitgleich nachrechenbar sein."
license = "PolyForm Shield License 1.0.0"

[dependencies]
myl-types = { path = "../../SHARED_TYPES/myl-types" }
myl-ledger = { path = "../../CONSENSUS/myl-ledger" }

[lib]
name = "myl_tokenomics"
path = "src/lib.rs"

# Testprofil, siehe die ausfuehrliche Begruendung in
# `SHARED_TYPES/myl-types/Cargo.toml`: optimiert, aber `debug-assertions`
# und `overflow-checks` bleiben an. ⚑ `--release` waere die falsche
# Antwort, weil es beide abschaltet.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2
