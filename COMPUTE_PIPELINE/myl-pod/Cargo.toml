[package]
name = "myl-pod"
version = "0.48.0"
edition = "2021"
rust-version = "1.99"
description = "L2-Compute-Pipeline für Myelith (Whitepaper Kap. 4, Anhang A.3): Pod-Mining-Loop mit Spur-Hashes und Eingangs-Prüfung (Manipulationserkennung), BLS-Signierung der Shard-Übergänge, KV-Cache-Session-Affinität und erasure-codierter DA-Archivierung. Konsumiert die INTEGER_LLM-Stage-API und myl-types."
license = "LicenseRef-PolyForm-Shield-1.0.0"
publish = false

[dependencies]
integer-llm-runtime = { path = "../../INTEGER_LLM/runtime" }
integer-llm-kernels = { path = "../../INTEGER_LLM/kernels" }
myl-types = { path = "../../SHARED_TYPES/myl-types" }
# Der vertrauliche Sitzungskanal. ⚑ **Nicht `myl-net`**: Der
# Shard-Prozess muss entsiegeln, aber nicht am Netz haengen. Ueber
# `myl-net` waeren es 181 zusaetzliche Kisten, ueber diese hier 21
# (gemessen 2026-09-03, Fund 155).
myl-siegel = { path = "../../NETWORKING/myl-siegel" }
borsh = { version = "1.6", features = ["derive"] }
myl-tokenomics = { path = "../../TOKENOMICS/myl-tokenomics" }
myl-scheduler = { path = "../../CONSENSUS/myl-scheduler" }
sha2 = "0.10"
# Nur fuer den Ausweis der lokalen Tuer: 32 Bytes aus der Zufallsquelle
# des Betriebssystems. Ein selbstgebauter Zufall waere hier die
# schlechteste Stelle fuer Eigenbau.
getrandom = "0.2"

# Nur für Tests: Der Redundanzvergleich gehört zu VERIFICATION, aber die
# Zusage „zwei Pods mit verschiedenem Zuschnitt sind vergleichbar" lässt
# sich nur gegen ihn belegen. Eine Nachbildung im Test wäre eine zweite
# Quelle für dieselbe Aussage (Fund 34).
[dev-dependencies]
myl-verifier = { path = "../../VERIFICATION/myl-verifier" }
myl-consensus = { path = "../../CONSENSUS/myl-consensus" }
# ⚑ Das 0,6B rechnet in den Netzproben (Pruefnetz); nur hier, nie im
# ausgelieferten Programm (INTEGER_LLM/runtime/src/netzfreigabe.rs).
integer-llm-runtime = { path = "../../INTEGER_LLM/runtime", features = ["pruefnetz"] }

# ⚑ **Ein Fälscher für den Prüfstand** (2026-10-28): Mit diesem Merkmal und
# `MYL_SHARD_FAELSCHEN=1` rechnet ein Shard auf einer um eins verschobenen
# Eingabe, in sich stimmig (Spur und Unterschrift passen). So prüft ein
# Netzlauf, dass zwei Pods uneinig werden. Nie im ausgelieferten Programm.
[features]
faelscher = []

[lib]
name = "myl_pod"
path = "src/lib.rs"

[[bin]]
name = "myl-pod-node"
path = "src/main.rs"

# ⚑ **Ein Shard als eigenes Programm** (Fund 186). Ohne dieses Binary
# gibt es keinen geshardeten Pod, sondern nur eine Maschine, die vier
# Rollen spielt.
[[bin]]
name = "myl-shard"
path = "src/bin/myl-shard.rs"

# Testprofil, siehe die ausfuehrliche Begruendung in
# `SHARED_TYPES/myl-types/Cargo.toml`: optimiert, aber `debug-assertions`
# und `overflow-checks` bleiben an. ⚑ `--release` waere die falsche
# Antwort, weil es beide abschaltet.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
# ⚑ **Weniger Debug-Info, keine Pruefung weniger** (2026-08-29). Volle
# Debug-Info kostete gemessen **26 Prozent Rechenzeit je Bau** und
# **40 Prozent Platz** (`myl-node`: 346 auf 256 Sekunden CPU, 2,5 auf
# 1,5 GB). Der Platz zaehlt doppelt, weil der CI-Cache pro Repositorium
# auf 10 GB gedeckelt ist und ein voller Deckel jeden Job kalt bauen
# laesst.
#
# `line-tables-only` behaelt **Datei und Zeile** in jedem Backtrace, und
# das ist, was man liest. Verloren geht nur das Inspizieren von
# Variablen im Debugger; wer das braucht, setzt lokal `debug = true`.
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"

# ⚑ **Nur die beiden rechnenden Kerne, nicht alle Abhaengigkeiten**
# (2026-08-29). `[profile.dev.package."*"]` stand hier einen Tag lang und
# war zu breit: Es uebersetzte auch `tokio`, `libp2p` und `blst`
# optimiert und kostete damit **40 Prozent mehr Rechenzeit je Bau**
# (gemessen an `myl-node`: 481 statt 344 Sekunden CPU). Auf einem
# Zwei-Kern-Runner schlaegt das voll auf die Wanduhr durch.
#
# Langsam waren die Tests aber nur dort, wo **ganzzahlig gerechnet**
# wird, und das sind diese beiden Crates. Sie sind klein; die grossen
# Abhaengigkeiten bauen wieder unoptimiert.
[profile.dev.package.integer-llm-kernels]
opt-level = 2

[profile.dev.package.integer-llm-runtime]
opt-level = 2

# Ueberlaufpruefung im Freigabebau, nur fuer die Protokollkisten
# (Festlegung des Projektinhabers, 2026-10-26). `--release` schaltet sie
# sonst ab, und eine Rechnung im Konsenspfad liefe an den Raendern still
# um; so wird aus einem stillen Fehler ein lauter Halt. Die Rechenkerne
# (`integer-llm-*`) bleiben ohne, dort zaehlt jede Anweisung, und sie
# rechnen mit ausdruecklichem `wrapping_*`. Ein Profil gilt nur in der
# Kiste, die gebaut wird, deshalb steht die Liste in jeder Programmkiste.
[profile.release.package.myl-types]
overflow-checks = true
[profile.release.package.myl-ledger]
overflow-checks = true
[profile.release.package.myl-scheduler]
overflow-checks = true
[profile.release.package.myl-tokenomics]
overflow-checks = true
[profile.release.package.myl-siegel]
overflow-checks = true
[profile.release.package.myl-pod]
overflow-checks = true
